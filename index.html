<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>변기키우기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: monospace;
}

button,
input {
  font-family: monospace;
}

button {
  cursor: pointer;
}

#game {
  position: relative;

  width: 100%;
  max-width: 430px;

  /* 구형 브라우저용 */
  height: 100vh;

  /* 최신 Safari / Chrome / Android */
  height: 100dvh;

  margin: 0 auto;
  overflow: hidden;
  background: white;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: block;
}

canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* =========================
   시작화면
========================= */

#startScreen {
  background: white;
  text-align: center;

  padding-top:
    env(safe-area-inset-top);
}

#title {
  margin-top: 22vh;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
}

#subtitle {
  margin-top: 10px;
  font-size: 12px;
}

#nameInput {
  display: block;

  width: 230px;
  height: 50px;

  margin:
    45px
    auto
    15px;

  border: 3px solid #111;

  outline: none;

  text-align: center;

  font-size: 16px;
}

#startButton {
  width: 210px;
  height: 58px;

  border: 3px solid #111;

  background: white;

  font-weight: bold;

  font-size: 16px;
}

/* =========================
   메인
========================= */

#mainCanvas,
#gachaCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#topBar {
  position: absolute;

  left: 8px;
  right: 8px;

  top:
    calc(
      8px +
      env(safe-area-inset-top)
    );

  display: flex;

  justify-content:
    space-between;

  pointer-events: none;

  z-index: 20;
}

.pixelBox {
  border: 2px solid #111;

  background:
    rgba(
      255,
      255,
      255,
      .95
    );

  padding: 7px 9px;

  font-size: 11px;

  font-weight: bold;
}

#coinBox {
  display: flex;
  align-items: center;

  min-width: 90px;
}

#coinIcon {
  position: relative;

  width: 21px;
  height: 21px;

  border: 2px solid #111;

  background: #f0c52d;

  margin-right: 6px;
}

#coinIcon::after {
  content: "";

  position: absolute;

  left: 6px;
  top: 3px;

  width: 5px;
  height: 9px;

  border:
    2px solid
    #916510;
}

#stats {
  position: absolute;

  left: 50%;

  top:
    calc(
      58px +
      env(safe-area-inset-top)
    );

  transform:
    translateX(-50%);

  z-index: 20;

  white-space: nowrap;
}

#plungerInfo {
  position: absolute;

  right: 8px;

  top:
    calc(
      58px +
      env(safe-area-inset-top)
    );

  z-index: 20;
}

#moveHelp {
  position: absolute;

  bottom:
    calc(
      165px +
      env(
        safe-area-inset-bottom
      )
    );

  width: 100%;

  text-align: center;

  font-size: 10px;

  z-index: 15;

  pointer-events: none;
}

#buttons {
  position: absolute;

  left: 8px;
  right: 8px;

  bottom:
    calc(
      9px +
      env(
        safe-area-inset-bottom
      )
    );

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 6px;

  z-index: 30;
}

.mainButton {
  height: 47px;

  border: 2px solid #111;

  background: white;

  font-weight: bold;

  font-size: 10px;
}

#earnButton {
  background: #d43a35;
  color: white;
}

#upgradeButton {
  background: #edc842;
}

#gachaButton {
  background: #6ba7dd;
}

#plungerShopButton {
  background: #d95d4c;
  color: white;
}

#toast {
  position: absolute;

  left: 50%;

  top:
    calc(
      105px +
      env(safe-area-inset-top)
    );

  transform:
    translateX(-50%);

  background: #111;

  color: white;

  border: 2px solid white;

  padding: 9px 12px;

  font-size: 11px;

  min-width: 170px;

  max-width: 310px;

  text-align: center;

  display: none;

  z-index: 100;
}

/* =========================
   뚜러뻥 아이콘
========================= */

.plungerIcon {
  display: inline-block;

  position: relative;

  width: 15px;
  height: 20px;

  margin-right: 4px;

  vertical-align: middle;
}

.plungerIcon::before {
  content: "";

  position: absolute;

  width: 4px;
  height: 13px;

  left: 6px;
  top: 0;

  background: #87552f;

  border: 1px solid #111;
}

.plungerIcon::after {
  content: "";

  position: absolute;

  width: 14px;
  height: 7px;

  left: 1px;
  bottom: 0;

  background: #d63732;

  border: 2px solid #111;
}

/* =========================
   강화
========================= */

#upgradeOverlay,
#confirmOverlay {
  position: absolute;

  inset: 0;

  background:
    rgba(
      0,
      0,
      0,
      .62
    );

  z-index: 100;

  display: none;
}

.modal {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 290px;

  transform:
    translate(
      -50%,
      -50%
    );

  background: white;

  border: 4px solid #111;

  padding: 18px;

  text-align: center;
}

#upgradeMachine {
  position: relative;

  width: 150px;
  height: 100px;

  margin: auto;
}

#upgradeToilet {
  position: absolute;

  width: 64px;
  height: 48px;

  left: 43px;
  top: 28px;

  border: 4px solid #111;

  background: #eee;

  animation:
    shake
    .15s
    infinite
    alternate;
}

.upSpark {
  position: absolute;

  width: 8px;
  height: 8px;

  background: #efc52f;

  animation:
    flash
    .2s
    infinite
    alternate;
}

.upSpark:nth-child(1) {
  left: 10px;
  top: 25px;
}

.upSpark:nth-child(2) {
  right: 10px;
  top: 20px;
  animation-delay: .05s;
}

.upSpark:nth-child(3) {
  left: 72px;
  top: 4px;
  animation-delay: .1s;
}

.upSpark:nth-child(4) {
  left: 20px;
  bottom: 6px;
  animation-delay: .15s;
}

.upSpark:nth-child(5) {
  right: 22px;
  bottom: 7px;
  animation-delay: .08s;
}

@keyframes shake {
  from {
    transform:
      translateX(-3px);
  }

  to {
    transform:
      translateX(3px);
  }
}

@keyframes flash {
  from {
    transform:
      scale(.7);
  }

  to {
    transform:
      scale(1.7);
  }
}

.modalButton {
  height: 40px;

  min-width: 100px;

  margin: 10px 4px 0;

  border: 2px solid #111;

  background: white;

  font-weight: bold;
}

/* =========================
   페이지
========================= */

.pageScreen {
  background: #e6e6e6;

  overflow-y: auto;

  padding-bottom:
    env(safe-area-inset-bottom);
}

.pageHeader {
  position: sticky;

  top: 0;

  height:
    calc(
      65px +
      env(safe-area-inset-top)
    );

  padding-top:
    env(safe-area-inset-top);

  background: white;

  border-bottom:
    3px solid #111;

  z-index: 20;
}

.pageHeader h2 {
  margin: 0;

  padding: 20px 15px;

  font-size: 17px;
}

.backButton {
  position: absolute;

  right: 10px;

  top:
    calc(
      10px +
      env(safe-area-inset-top)
    );

  width: 72px;
  height: 42px;

  border: 2px solid #111;

  background: white;

  font-weight: bold;
}

/* =========================
   컬렉션
========================= */

#collectionList {
  padding: 9px;
}

.card {
  display: flex;

  align-items: center;

  min-height: 108px;

  background: white;

  border: 2px solid #111;

  margin-bottom: 8px;

  padding: 7px;

  gap: 8px;
}

.card canvas {
  width: 92px;
  height: 90px;

  border: 1px solid #aaa;

  flex: 0 0 auto;
}

.cardInfo {
  font-size: 10px;

  line-height: 1.55;
}

/* =========================
   가구
========================= */

#furnitureContent {
  padding: 10px;
}

.furnitureCard {
  background: white;

  border: 2px solid #111;

  padding: 10px;

  margin-bottom: 9px;
}

.furnitureTitle {
  font-weight: bold;

  font-size: 14px;
}

.furnitureDescription {
  margin: 7px 0;

  font-size: 11px;

  line-height: 1.5;
}

.buyFurniture {
  height: 38px;

  border: 2px solid #111;

  background: #efc842;

  font-weight: bold;
}

.buyFurniture:disabled {
  background: #bbb;
}

/* =========================
   뽑기
========================= */

#gachaScreen {
  background: #d7d7d7;
}

#gachaBack {
  position: absolute;

  left: 9px;

  top:
    calc(
      9px +
      env(safe-area-inset-top)
    );

  width: 70px;
  height: 42px;

  border: 2px solid #111;

  background: white;

  z-index: 20;
}

#gachaTitle {
  position: absolute;

  top:
    calc(
      18px +
      env(safe-area-inset-top)
    );

  width: 100%;

  text-align: center;

  font-weight: bold;

  z-index: 10;
}

#gachaCoins {
  position: absolute;

  right: 9px;

  top:
    calc(
      9px +
      env(safe-area-inset-top)
    );

  z-index: 20;
}

#gachaPull,
#openCapsule {
  position: absolute;

  left: 50%;

  bottom:
    calc(
      23px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  width: 220px;
  height: 58px;

  border: 3px solid #111;

  font-weight: bold;

  z-index: 30;
}

#gachaPull {
  background: #efc842;
  font-size: 15px;
}

#openCapsule {
  background: white;
  display: none;
}

#gachaResult {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(
      -50%,
      -50%
    );

  width: 290px;
  min-height: 280px;

  background: white;

  border: 4px solid #111;

  display: none;

  text-align: center;

  padding: 15px;

  z-index: 60;
}

#gachaResult.rareGlow {
  animation:
    rarePulse
    .55s
    infinite
    alternate;
}

@keyframes rarePulse {
  from {
    box-shadow:
      0 0 8px #fff,
      0 0 18px #f0c62e;
  }

  to {
    box-shadow:
      0 0 18px #fff,
      0 0 45px #f0c62e,
      0 0 75px #ffdf42;
  }
}

#resultCanvas {
  width: 130px;
  height: 105px;
}

#resultName {
  font-size: 18px;

  font-weight: bold;

  margin-top: 5px;
}

#resultAbility {
  margin-top: 10px;

  font-size: 11px;

  line-height: 1.5;
}

/* 아주 작은 화면 대응 */

@media
(max-height: 650px) {

  .mainButton {
    height: 40px;
  }

  #buttons {
    gap: 4px;
  }

  #moveHelp {
    bottom:
      calc(
        140px +
        env(
          safe-area-inset-bottom
        )
      );
  }

  #stats {
    font-size: 9px;
  }

}
</style>
</head>

<body>

<div id="game">

  <div
    id="startScreen"
    class="screen active"
  >

    <div id="title">
      변기키우기
    </div>

    <div id="subtitle">
      나만의 이상한 화장실
    </div>

    <input
      id="nameInput"
      maxlength="10"
      placeholder="플레이어 이름"
    >

    <button type="button" id="startButton">
      게임 시작
    </button>

  </div>


  <div
    id="mainScreen"
    class="screen"
  >

    <canvas id="mainCanvas"></canvas>

    <div id="topBar">

      <div
        id="coinBox"
        class="pixelBox"
      >

        <div id="coinIcon"></div>

        <span id="coinText">
          0
        </span>

      </div>

      <div
        id="playerName"
        class="pixelBox"
      >
        PLAYER
      </div>

    </div>

    <div
      id="stats"
      class="pixelBox"
    >
      획득량 1 / 쿨타임 1.0초 / 강화 35%
    </div>

    <div
      id="plungerInfo"
      class="pixelBox"
    >

      <span class="plungerIcon"></span>

      <span id="plungerCount">
        0
      </span>

    </div>

    <div id="moveHelp">
      빈 곳 두 번 터치: 이동 / 움직이는 변기 한 번 터치: 뚜러뻥
    </div>

    <div id="buttons">

      <button type="button"
        id="earnButton"
        class="mainButton"
      >
        돈벌기
      </button>

      <button type="button"
        id="upgradeButton"
        class="mainButton"
      >
        강화
      </button>

      <button type="button"
        id="gachaButton"
        class="mainButton"
      >
        변기 뽑기
      </button>

      <button type="button"
        id="collectionButton"
        class="mainButton"
      >
        보유 변기
      </button>

      <button type="button"
        id="furnitureButton"
        class="mainButton"
      >
        가구 상점
      </button>

      <button type="button"
        id="plungerShopButton"
        class="mainButton"
      >
        뚜러뻥 50
      </button>

    </div>

    <div id="toast"></div>


    <div id="upgradeOverlay">

      <div class="modal">

        <div id="upgradeMachine">

          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>

          <div id="upgradeToilet"></div>

        </div>

        <div id="upgradeMessage">
          강화 중...
        </div>

        <button type="button"
          id="upgradeClose"
          class="modalButton"
          style="display:none"
        >
          확인
        </button>

      </div>

    </div>


    <div id="confirmOverlay">

      <div class="modal">

        <div
          style="
            font-size:17px;
            font-weight:bold;
            margin-bottom:12px;
          "
        >
          뚜러뻥
        </div>

        <div
          id="confirmText"
          style="
            font-size:12px;
            line-height:1.6;
          "
        ></div>

        <button type="button"
          id="confirmYes"
          class="modalButton"
        >
          사용한다
        </button>

        <button type="button"
          id="confirmNo"
          class="modalButton"
        >
          안 한다
        </button>

      </div>

    </div>

  </div>


  <div
    id="gachaScreen"
    class="screen"
  >

    <canvas id="gachaCanvas"></canvas>

    <button type="button" id="gachaBack">
      뒤로
    </button>

    <div id="gachaTitle">
      변기 뽑기
    </div>

    <div
      id="gachaCoins"
      class="pixelBox"
    >
      COIN
      <span id="gachaCoinText">
        0
      </span>
    </div>

    <button type="button" id="gachaPull">
      30 COIN 뽑기
    </button>

    <button type="button" id="openCapsule">
      캡슐 열기
    </button>

    <div id="gachaResult">

      <canvas
        id="resultCanvas"
        width="130"
        height="105"
      ></canvas>

      <div id="resultName"></div>

      <div id="resultAbility"></div>

      <button type="button"
        id="resultClose"
        class="modalButton"
      >
        확인
      </button>

    </div>

  </div>


  <div
    id="collectionScreen"
    class="screen pageScreen"
  >

    <div class="pageHeader">

      <h2>
        보유 변기
      </h2>

      <button type="button"
        id="collectionBack"
        class="backButton"
      >
        뒤로
      </button>

    </div>

    <div id="collectionList"></div>

  </div>


  <div
    id="furnitureScreen"
    class="screen pageScreen"
  >

    <div class="pageHeader">

      <h2>
        가구 상점
      </h2>

      <button type="button"
        id="furnitureBack"
        class="backButton"
      >
        뒤로
      </button>

    </div>

    <div id="furnitureContent"></div>

  </div>

</div>


<script>

/* =========================
   화면
========================= */

const screens = {
  start:
    document.getElementById(
      "startScreen"
    ),

  main:
    document.getElementById(
      "mainScreen"
    ),

  gacha:
    document.getElementById(
      "gachaScreen"
    ),

  collection:
    document.getElementById(
      "collectionScreen"
    ),

  furniture:
    document.getElementById(
      "furnitureScreen"
    )
};


function showScreen(name) {

  Object
    .values(screens)
    .forEach(
      screen => {

        screen
          .classList
          .remove("active");

      }
    );


  screens[name]
    .classList
    .add("active");


  if (name === "main") {

    resizeMainCanvas();

  }


  if (name === "gacha") {

    resizeGachaCanvas();

  }

}

function calculateIncome() {

  let result =
    moneyPower;


  characters.forEach(
    (character,index) => {

      let amount =
        owned[index];


      if (index === 0) {

        amount =
          Math.max(
            0,
            amount - 1
          );

      }


      result +=
        (
          character.buffIncome ||
          0
        ) *
        amount;


      result -=
        (
          character.debuffIncome ||
          0
        ) *
        amount;

    }
  );


  return Math.max(
    1,
    Math.floor(result)
  );

}


function calculateCooldown() {

  let result =
    earnCooldown;


  characters.forEach(
    (character,index) => {

      let amount =
        owned[index];


      if (index === 0) {

        amount =
          Math.max(
            0,
            amount - 1
          );

      }


      result -=
        (
          character.cooldownBuff ||
          0
        ) *
        amount;


      result +=
        (
          character.debuffCooldown ||
          0
        ) *
        amount;

    }
  );


  return Math.max(
    .1,
    result
  );

}


function updateUI() {

  coinText.textContent =

  gachaCoinText.textContent =
    Math.floor(coins);

  plungerCount.textContent =

  stats.textContent =
    "획득량 " +
    calculateIncome() +
    " / 쿨타임 " +
    calculateCooldown()
      .toFixed(1) +
    "초 / 강화 35%";

}

function resizeMainCanvas() {

}


const player = {

  x: 180,
  y: 340,

  targetX: 180,
  targetY: 340,

  speed: 3,

  moving: false,

  direction: 1

};


function pointerPosition(
  canvas,
  event
) {

  const rect =
    canvas
      .getBoundingClientRect();


  return {

    x:
      (
        event.clientX -
        rect.left
      )
      *
      canvas.width
      /
      rect.width,

    y:
      (
        event.clientY -
        rect.top
      )
      *
      canvas.height
      /
      rect.height

  };

}


/* =========================
   이동 + 뚜러뻥 선택
========================= */

let lastTap =
  0;

let selectedRemoveIndex =
  null;


mainCanvas
  .addEventListener(
    "pointerdown",
    event => {

      const pos =
        pointerPosition(
          mainCanvas,
          event
        );


      for (
        let i =
          roamingCharacters.length - 1;

        i >= 0;

        i--
      ) {

        const character =
          roamingCharacters[i];


        if (
          pos.x >=
          character.x - 5
          &&
          pos.x <=
          character.x + 70
          &&
          pos.y >=
          character.y - 5
          &&
          pos.y <=
          character.y + 75
        ) {

          openPlungerConfirm(
            i
          );

          return;

        }

      }


      const now =
        Date.now();


      if (
        now - lastTap <
        320
      ) {

        player.targetX =
          Math.max(
            5,
            Math.min(
              mainCanvas.width -
              70,
              pos.x - 30
            )
          );


        player.targetY =
          Math.max(
            115,
            Math.min(
              mainCanvas.height -
              175,
              pos.y - 35
            )
          );


        player.direction =
          player.targetX <
          player.x
          ? -1
          : 1;


        player.moving =
          true;

      }


      lastTap =
        now;

    }
  );


function updatePlayer() {

  if (!player.moving) {
    return;
  }


  const dx =
    player.targetX -
    player.x;

  const dy =
    player.targetY -
    player.y;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if (distance < 3) {

    player.x =
      player.targetX;

    player.y =
      player.targetY;

    player.moving =
      false;

    return;

  }


  player.x +=
    dx /
    distance *
    player.speed;


  player.y +=
    dy /
    distance *
    player.speed;

}

function drawBackground() {

    "#ededed";


  ctx.fillRect(
    0,

    115
  );

    "#999";

  ctx.fillStyle =
    "#d5d5d5";


  ctx.fillRect(
    0,
    116,
    mainCanvas.width,
    mainCanvas.height -
    116
  );


  const tile =
    43;


  ctx.strokeStyle =
    "#bdbdbd";


  for (
    let x = 0;
    x < mainCanvas.width;
    x += tile
  ) {

    ctx.beginPath();


    ctx.moveTo(
      x,
      116
    );


    ctx.lineTo(
      x,
      mainCanvas.height
    );


    ctx.stroke();

  }


  for (
    let y = 116;
    y < mainCanvas.height;
    y += tile
  ) {

    ctx.beginPath();


    ctx.moveTo(
      0,
      y
    );


    ctx.lineTo(
      mainCanvas.width,
      y
    );


    ctx.stroke();

  }

}

function addRoamingCharacter(
  characterIndex
) {

  const angle =
    Math.random() *
    Math.PI *
    2;


  roamingCharacters.push({

    characterIndex,

    x:
      15 +
      Math.random() *
      Math.max(
        30,
        mainCanvas.width -
        90
      ),

    y:
      135 +
      Math.random() *
      Math.max(
        80,
        mainCanvas.height -
        340
      ),

    vx:
      Math.cos(angle) *
      (
        .25 +
        Math.random() *
        .4
      ),

    vy:
      Math.sin(angle) *
      (
        .25 +
        Math.random() *
        .4
      ),

    phase:
      Math.random() *
      10

  });

}


function updateRoaming() {

  roamingCharacters
    .forEach(
      character => {

        character.x +=
          character.vx;


        character.y +=
          character.vy;


        if (
          character.x < 2
          ||
          character.x >
          mainCanvas.width -
          70
        ) {

          character.vx *=
            -1;

        }


        if (
          character.y < 120
          ||
          character.y >
          mainCanvas.height -
          180
        ) {

          character.vy *=
            -1;

        }


        character.phase +=
          .05;

      }
    );

}

    .forEach(
      drawFurniture
    );


  roamingCharacters
    .forEach(
      character => {

        drawCharacter(
          ctx,
          characters[
            character.characterIndex
          ],
          character.x,
          character.y +
          Math.sin(
            character.phase
          ) *
          1.5
        );

      }
    );


  const bounce =
    player.moving
    ?
    Math.sin(
      performance.now() /
      90
    ) *
    2
    :
    0;


  ctx.save();


  if (
    player.direction < 0
  ) {

    ctx.translate(
      player.x + 65,
      0
    );


    ctx.scale(
      -1,
      1
    );


    drawCharacter(
      ctx,
      characters[0],
      0,
      player.y +
      bounce
    );

  } else {

    drawCharacter(
      ctx,
      characters[0],
      player.x,
      player.y +
      bounce
    );

  }


  ctx.restore();


  ctx.fillStyle =
    "#111";


  ctx.font =
    "11px monospace";


  ctx.textAlign =
    "center";


  ctx.fillText(
    playerNameValue,
    player.x + 31,

  );

function randomCharacter() {

  const total =
    characters.reduce(
      (
        sum,
        character
      ) =>
        sum +
        character.weight,
      0
    );


  let value =
    Math.random() *
    total;


  for (
    let i = 0;
    i < characters.length;
    i++
  ) {

    value -=
      characters[i].weight;


    if (
      value <= 0
    ) {

      return i;

    }

  }


  return 0;

}

  context.arc(
    x,

    radius - 3,
    Math.PI,
    0
  );


  context.fill();


  context.fillStyle =
    "#eee";


  context.beginPath();


  context.arc(
    x,
    y,
    radius - 3,
    0,
    Math.PI
  );


  context.fill();


  context.fillStyle =
    "#111";


  context.fillRect(
    x - radius + 2,
    y - 2,
    radius * 2 - 4,
    4
  );

        () => {

          gachaState =
            "ready";


          openCapsule
            .style
            .display =
              "block";

        },
        1200
      );

    }
  );


openCapsule
  .addEventListener(
    "click",
    () => {

      const character =
        characters[
          currentGacha
        ];


      owned[
        currentGacha
      ]++;


      addRoamingCharacter(
        currentGacha
      );


      resultContext
        .clearRect(
          0,
          0,
          130,
          105
        );


      if (
        character.gold
        ||
        character.rarity ===
        "레어"
      ) {

        gachaResult
          .classList
          .add(
            "rareGlow"
          );


        for (
          let i = 0;
          i < 10;
          i++
        ) {

          const angle =
            Math.PI *
            2 /
            10 *
            i;


          resultContext
            .fillStyle =
              i % 2 === 0
              ?
              "#f1c52c"
              :
              "#fff1a0";


          resultContext
            .fillRect(
              65 +
              Math.cos(angle) *
              46,
              53 +
              Math.sin(angle) *
              38,
              6,
              6
            );

        }

      } else {

        gachaResult
          .classList
          .remove(
            "rareGlow"
          );

      }


      drawCharacter(
        resultContext,
        character,
        33,
        15
      );


      document
        .getElementById(
          "resultName"
        )
        .textContent =
          character.name +
          " / " +
          character.rarity;


      document
        .getElementById(
          "resultAbility"
        )
        .innerHTML =
          "<b>" +
          character.ability +
          "</b><br>" +
          character.description;


      gachaResult
        .style
        .display =
          "block";


      openCapsule
        .style
        .display =
          "none";


      gachaState =
        "result";


      updateUI();

    }
  );


document
  .getElementById(
    "resultClose"
  )
  .addEventListener(
    "click",
    () => {

      gachaResult
        .style
        .display =
          "none";


      gachaResult
        .classList
        .remove(
          "rareGlow"
        );


      gachaPull
        .style
        .display =
          "block";


      gachaState =
        "idle";


      currentGacha =
        null;

    }
  );


/* =========================
   컬렉션
========================= */

document
  .getElementById(
    "collectionButton"
  )
  .addEventListener(
    "click",
    () => {

      buildCollection();

      showScreen(
        "collection"
      );

    }
  );


document
  .getElementById(
    "collectionBack"
  )
  .addEventListener(
    "click",
    () => {

      showScreen(
        "main"
      );

    }
  );


function buildCollection() {

  const list =
    document.getElementById(
      "collectionList"
    );


  list.innerHTML =
    "";


  characters.forEach(
    (character,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        92;

      canvas.height =
        90;


      const cctx =
        canvas.getContext(
          "2d"
        );


      if (
        owned[index] > 0
      ) {

        drawCharacter(
          cctx,
          character,
          14,
          8
        );

      } else {

        cctx.fillStyle =
          "#222";


        cctx.font =
          "40px monospace";


        cctx.fillText(
          "?",
          33,
          57
        );

      }


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "cardInfo";


      if (
        owned[index] > 0
      ) {

        info.innerHTML =
          "<b>" +
          character.name +
          "</b><br>" +
          "등급: " +
          character.rarity +
          "<br>" +
          "보유: " +
          owned[index] +
          "개<br>" +
          "<b>" +
          character.ability +
          "</b><br>" +
          character.description;


        if (
          character.negative
        ) {

          info.innerHTML +=
            "<br><b>디버프 적용 중</b>";

        }

      } else {

        info.innerHTML =
          "<b>미발견 캐릭터</b>" +
          "<br>???<br>" +
          "보유 0개";

      }


      card.appendChild(
        canvas
      );


      card.appendChild(
        info
      );


      list.appendChild(
        card
      );

    }
  );

}


/* =========================
   가구 상점
========================= */

document
  .getElementById(
    "furnitureButton"
  )
  .addEventListener(
    "click",
    () => {

      buildFurnitureShop();

      showScreen(
        "furniture"
      );

    }
  );


document
  .getElementById(
    "furnitureBack"
  )
  .addEventListener(
    "click",
    () => {

      showScreen(
        "main"
      );

    }
  );


function buildFurnitureShop() {

  const content =
    document.getElementById(
      "furnitureContent"
    );


  content.innerHTML =
    "";


  furnitureCatalog.forEach(
    (item,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "furnitureCard";


      const purchased =
        purchasedFurniture[
          index
        ];


      card.innerHTML =
        '<div class="furnitureTitle">' +
        item.name +
        '</div>' +
        '<div class="furnitureDescription">' +
        item.description +
        '<br>가격: ' +
        item.price +
        ' 코인</div>';


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "buyFurniture";


      button.textContent =
        purchased
        ?
        "구매 완료"
        :
        item.price +
        " COIN 구매";


      button.disabled =
        purchased;


      button.addEventListener(
        "click",
        () => {

          if (
            purchasedFurniture[
              index
            ]
          ) {

            return;

          }


          if(!FREE_MODE && coins <
            item.price
          ) {

            alert(
              "코인이 부족합니다."
            );

            return;

          }


          if(!FREE_MODE) coins -= item.price;


          purchasedFurniture[
            index
          ] =
            true;


          placedFurniture.push({

            type:
              item.type,

            x:
              45 +
              Math.random() *
              Math.max(
                40,
                mainCanvas.width -
                100
              ),

            y:
              170 +
              Math.random() *
              Math.max(
                60,
                mainCanvas.height -
                400
              )

          });


          startFurnitureEffect(
            item
          );


          updateUI();

          buildFurnitureShop();

        }
      );


      card.appendChild(
        button
      );


      content.appendChild(
        card
      );

    }
  );

}


function startFurnitureEffect(
  item
) {

  setInterval(
    () => {

      let gain;


      if (
        item.doubleIncome
      ) {

        gain =
          calculateIncome() *
          2;

      } else {

        gain =
          item.income;

      }


      coins +=
        gain;


      updateUI();

    },
    item.interval
  );

}


/* =========================
   메인 루프
========================= */

function loop() {

  if (
    screens.main
      .classList
      .contains(
        "active"
      )
  ) {

    updatePlayer();

    updateRoaming();

    drawMain();

  }


  if (
    screens.gacha
      .classList
      .contains(
        "active"
      )
  ) {

    if (
      gachaState ===
      "falling"
    ) {

      capsuleY +=
        4.3;


      if (
        capsuleY >
        515
      ) {

        capsuleY =
          515;

      }

    }


    drawGacha();

  }


  requestAnimationFrame(
    loop
  );

}


/* =========================
   Safari 주소창 높이 대응
========================= */

function refreshGameHeight() {

  /*
    100dvh를 지원하는 브라우저에서는
    CSS가 알아서 처리한다.

    일부 구형 Safari를 위해
    실제 innerHeight도 변수로 저장.
  */

  document
    .documentElement
    .style
    .setProperty(
      "--real-height",
      window.innerHeight +
      "px"
    );


  resizeMainCanvas();

  resizeGachaCanvas();

}


window.addEventListener(
  "resize",
  refreshGameHeight
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      refreshGameHeight,
      200
    );

  }
);


if (
  window.visualViewport
) {

  window.visualViewport
    .addEventListener(
      "resize",
      refreshGameHeight
    );

}


/* =========================
   시작
========================= */

refreshGameHeight();

updateUI();

loop();

</script>

  function hvictory(){hcasualties();const clearedStage=hs.stage,i=idx(HR[clearedStage]);owned[i]++;discovered[i]=true;coins+=100000000000;hs.sup.potion=(hs.sup.potion||0)+4;hs.mats+=20;hs.highestUnlocked=Math.max(hs.highestUnlocked,Math.min(HD.length-1,clearedStage+1));uniqueRoamers();save();hs.view="home";hs.battle=null;hsave();hiddenAnnouncement(HR[clearedStage],`${HD[clearedStage]} 보스 처치 보상 · ${clearedStage<HD.length-1?`${clearedStage+2}단계 해금 · `:"최종 단계 클리어 · "}1,000억·회복제 4`);hhome()}
  function hrevive(){hamletContent.innerHTML=`<div class="hamletCard"><h2>전용 부활소</h2>부활권 ${hs.revive}개<br>${hs.dead.length?hs.dead.map(i=>`<button type="button" data-r="${i}">${characters[i].name} 부활</button>`).join(""):"부활 가능한 보상 변기가 없습니다."}<button type="button" data-v="home">돌아가기</button></div>`;hamletContent.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(hs.revive<1)return toast("부활권이 없습니다.");const i=+b.dataset.r;hs.revive--;owned[i]++;hs.dead=hs.dead.filter(x=>x!==i);save();hsave();hrevive()});hamletContent.querySelector("[data-v]").onclick=()=>{hs.view="home";hrender()}}
  function hstats(){const list=eligible();hamletContent.innerHTML=`<div class="hamletCard"><h2>능력치 개조소</h2>강화 재료 ${hs.mats}개 · 단계별 총 강화 한도 ${(hs.stage+1)*3}<div>${list.map(([c,i])=>{const u=hs.up[i]||{atk:0,dodge:0,mind:0},sum=u.atk+u.dodge+u.mind;return `<div class="hamletCard"><b>${c.name}</b><br>공격 ${c.attack+u.atk} <button type="button" data-u="${i},atk">+</button> 회피 ${u.dodge} <button type="button" data-u="${i},dodge">+</button> 정신력 ${u.mind} <button type="button" data-u="${i},mind">+</button><br>${sum}/${(hs.stage+1)*3}</div>`}).join("")}</div><button type="button" data-v="home">돌아가기</button></div>`;hamletContent.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.u.split(","),u=hs.up[i]||(hs.up[i]={atk:0,dodge:0,mind:0}),sum=u.atk+u.dodge+u.mind,cost=5+sum*3;if(sum>=(hs.stage+1)*3)return toast("현재 단계 강화 한도입니다.");if(hs.mats<cost)return toast(`재료 ${cost}개가 필요합니다.`);hs.mats-=cost;u[k]++;hsave();hstats()});hamletContent.querySelector("[data-v]").onclick=()=>{hs.view="home";hrender()}}

  /* =========================
     몬스터 전투 패치
     - 파일에 실제 전투 로직이 없어서 공격력 데이터를 이용해 새 전투 화면을 추가한다.
     - 몬스터/보스 HP는 낮춘 밸런스로 시작한다.
     - 몬스터 턴은 몬스터 수만큼 1회씩 공격한다.
  ========================= */
  const battleStyle=document.createElement("style");battleStyle.textContent=`
    #battleScreen .extraContent{padding:10px 10px 90px;background:#d7dde7;min-height:100%}
    .battleTop,.battlePanel{border:3px solid #111;background:#fff;padding:10px;margin-bottom:9px}
    .battleField{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .battleUnit{border:2px solid #111;background:#f7f7f7;padding:7px;min-height:92px;transition:.18s}
    .battleUnit.targeted{background:#69aef0;box-shadow:0 0 0 4px #bce2ff inset;transform:scale(1.02)}
    .battleUnit.dead{opacity:.35;filter:grayscale(1)}
    .battleUnit .hpbar{height:9px;border:1px solid #111;background:#ddd;margin-top:5px}
    .battleUnit .hpbar i{display:block;height:100%;background:#d94d46}
    .battleLog{height:130px;overflow:auto;border:2px solid #111;background:#161b24;color:#fff;padding:8px;font-size:10px;line-height:1.5}
    .battleActions{display:flex;gap:6px;margin:8px 0}.battleActions button{flex:1;height:42px;border:2px solid #111;background:#fff;font-weight:bold}
  `;document.head.appendChild(battleStyle);
  const battleContent=screen("battleScreen","몬스터 전투");
  const battleButton=document.createElement("button");battleButton.className="mainButton";battleButton.textContent="몬스터 전투";document.getElementById("buttons").appendChild(battleButton);document.getElementById("buttons").style.gridTemplateColumns="repeat(3,1fr)";
  let battleStage=1,battleTurn="ready",battleBusy=false,battleTeam=[],battleEnemies=[],battleLog=[];
  function battleEligible(){const units=[];characters.forEach((c,i)=>{if(c.attack<=0||c.negative||c.rarity==="크툴루"||c.rarity==="히든")return;for(let n=0;n<Math.min(3,owned[i]||0);n++)units.push({name:c.name,attack:c.attack,maxHp:110+c.attack*2,hp:110+c.attack*2})});return units.sort((a,b)=>b.attack-a.attack).slice(0,4)}
  function makeEnemies(stage){const boss=stage%5===0,count=boss?1:Math.min(4,2+Math.floor((stage-1)/3));const arr=[];for(let i=0;i<count;i++){const maxHp=boss?Math.round(260+stage*42):Math.round(80+stage*24+i*14);arr.push({name:boss?`보스 몬스터 Lv.${stage}`:`몬스터 ${i+1}`,boss,maxHp,hp:maxHp,attack:boss?Math.round(23+stage*3.5):Math.round(11+stage*2.2+i*2)})}return arr}
  function battleSay(t){battleLog.push(t);if(battleLog.length>40)battleLog.shift()}
  function hpPct(u){return Math.max(0,Math.min(100,u.hp/u.maxHp*100))}
  function battleRender(msg=""){const aliveP=battleTeam.filter(x=>x.hp>0),aliveE=battleEnemies.filter(x=>x.hp>0),boss=battleEnemies.some(x=>x.boss);battleContent.innerHTML=`<div class="battleTop"><b>스테이지 ${battleStage}${boss?" · BOSS":""}</b><br><small>완전 교대제 · 우리 편 4명 전부 공격 후 몬스터 전원 공격 · 상대 턴에는 공격 불가</small>${msg?`<br><b>${msg}</b>`:""}</div><div class="battlePanel"><b>우리 편 (${aliveP.length}/${battleTeam.length})</b><div class="battleField">${battleTeam.map((u,i)=>`<div class="battleUnit ${u.hp<=0?"dead":""}" id="ally${i}"><b>${u.name}</b><br>ATK ${u.attack} · HP ${Math.max(0,Math.ceil(u.hp))}/${u.maxHp}<div class="hpbar"><i style="width:${hpPct(u)}%"></i></div></div>`).join("")}</div></div><div class="battlePanel"><b>몬스터 (${aliveE.length}/${battleEnemies.length})</b><div class="battleField">${battleEnemies.map((u,i)=>`<div class="battleUnit ${u.hp<=0?"dead":""}" id="enemy${i}"><b>${u.boss?"👑 ":""}${u.name}</b><br>ATK ${u.attack} · HP ${Math.max(0,Math.ceil(u.hp))}/${u.maxHp}<div class="hpbar"><i style="width:${hpPct(u)}%"></i></div></div>`).join("")}</div></div><div class="battleActions"><button type="button" id="battleAttack" ${battleBusy||battleTurn!=="player"||!aliveP.length||!aliveE.length?"disabled":""}>우리 편 공격</button><button type="button" id="battleReset">전투 다시 시작</button></div><div class="battleLog">${battleLog.slice().reverse().join("<br>")}</div>`;const a=battleContent.querySelector("#battleAttack"),r=battleContent.querySelector("#battleReset");if(a)a.onclick=playerBattleTurn;if(r)r.onclick=()=>startBattle(true)}
  function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
  async function flashTarget(id){const el=battleContent.querySelector(id);if(!el)return;el.classList.add("targeted");await delay(900);el.classList.remove("targeted");await delay(300)}
  async function playerBattleTurn(){if(battleBusy||battleTurn!=="player")return;battleBusy=true;for(let i=0;i<battleTeam.length;i++){const ally=battleTeam[i];if(ally.hp<=0)continue;const alive=battleEnemies.map((e,j)=>[e,j]).filter(([e])=>e.hp>0);if(!alive.length)break;const [target,ti]=alive[Math.floor(Math.random()*alive.length)];await flashTarget(`#enemy${ti}`);target.hp-=ally.attack;battleSay(`${ally.name} → ${target.name} : ${ally.attack} 피해`);battleRender();await delay(450)}if(battleEnemies.every(e=>e.hp<=0)){battleBusy=false;battleTurn="win";const reward=battleStage%5===0?battleStage*1800:battleStage*320;coins+=reward;totalEarned+=reward;battleSay(`승리! +${reward.toLocaleString()} 코인`);battleStage++;save();updateUI();battleRender("승리! 다음 전투는 '전투 다시 시작'으로 진행");return}battleTurn="monster";battleRender("몬스터 턴");await delay(900);await monsterBattleTurn()}
  async function monsterBattleTurn(){/* 살아있는 몬스터 수만큼 정확히 공격 */for(let ei=0;ei<battleEnemies.length;ei++){const enemy=battleEnemies[ei];if(enemy.hp<=0)continue;const alive=battleTeam.map((u,j)=>[u,j]).filter(([u])=>u.hp>0);if(!alive.length)break;const [target,ti]=alive[Math.floor(Math.random()*alive.length)];battleRender(`${enemy.name}의 공격 대상 표시`);await flashTarget(`#ally${ti}`);target.hp-=enemy.attack;battleSay(`${enemy.name} → ${target.name} : ${enemy.attack} 피해`);battleRender(`${enemy.name} 공격 완료`);await delay(800)}if(battleTeam.every(u=>u.hp<=0)){battleBusy=false;battleTurn="lose";battleSay("패배했습니다.");battleRender("패배");return}battleBusy=false;battleTurn="player";battleRender("우리 편 턴")}
  function startBattle(manual=false){battleTeam=battleEligible();if(!battleTeam.length){battleLog=["전투 가능한 변기를 먼저 획득하세요."];battleEnemies=[];battleTurn="ready";battleRender();return}battleEnemies=makeEnemies(battleStage);battleLog=[`${battleStage%5===0?"보스":"몬스터"} 전투 시작!`];battleTurn="player";battleBusy=false;battleRender("우리 편 턴")}
  battleButton.onclick=()=>{showScreen("battleScreen");startBattle()};

  const start=cloneButton("startButton");start.onclick=()=>{const input=document.getElementById("nameInput").value.trim();playerNameValue=input||"PLAYER";document.getElementById("playerName").textContent=playerNameValue;showScreen("main");save();updateUI()};
  window.addEventListener("beforeunload",save);load();runAssetTax();evaluateHidden();checkTrophyAchievement();uniqueRoamers();updateUI();
})();
</script>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("button").forEach(b=>{
    if(b.textContent.trim()==="몬스터 전투" && !b.closest("#hamletScreen")) b.remove();
  });
});
</script>
