<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>변기키우기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: monospace;
}

button,
input {
  font-family: monospace;
}

button {
  cursor: pointer;
}

#game {
  position: relative;

  width: 100%;
  max-width: 430px;

  /* 구형 브라우저용 */
  height: 100vh;

  /* 최신 Safari / Chrome / Android */
  height: 100dvh;

  margin: 0 auto;
  overflow: hidden;
  background: white;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: block;
}

canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* =========================
   시작화면
========================= */

#startScreen {
  background: white;
  text-align: center;

  padding-top:
    env(safe-area-inset-top);
}

#title {
  margin-top: 22vh;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
}

#subtitle {
  margin-top: 10px;
  font-size: 12px;
}

#nameInput {
  display: block;

  width: 230px;
  height: 50px;

  margin:
    45px
    auto
    15px;

  border: 3px solid #111;

  outline: none;

  text-align: center;

  font-size: 16px;
}

#startButton {
  width: 210px;
  height: 58px;

  border: 3px solid #111;

  background: white;

  font-weight: bold;

  font-size: 16px;
}

/* =========================
   메인
========================= */

#mainCanvas,
#gachaCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#topBar {
  position: absolute;

  left: 8px;
  right: 8px;

  top:
    calc(
      8px +
      env(safe-area-inset-top)
    );

  display: flex;

  justify-content:
    space-between;

  pointer-events: none;

  z-index: 20;
}

.pixelBox {
  border: 2px solid #111;

  background:
    rgba(
      255,
      255,
      255,
      .95
    );

  padding: 7px 9px;

  font-size: 11px;

  font-weight: bold;
}

#coinBox {
  display: flex;
  align-items: center;

  min-width: 90px;
}

#coinIcon {
  position: relative;

  width: 21px;
  height: 21px;

  border: 2px solid #111;

  background: #f0c52d;

  margin-right: 6px;
}

#coinIcon::after {
  content: "";

  position: absolute;

  left: 6px;
  top: 3px;

  width: 5px;
  height: 9px;

  border:
    2px solid
    #916510;
}

#stats {
  position: absolute;

  left: 50%;

  top:
    calc(
      58px +
      env(safe-area-inset-top)
    );

  transform:
    translateX(-50%);

  z-index: 20;

  white-space: nowrap;
}

#plungerInfo {
  position: absolute;

  right: 8px;

  top:
    calc(
      58px +
      env(safe-area-inset-top)
    );

  z-index: 20;
}

#moveHelp {
  position: absolute;

  bottom:
    calc(
      165px +
      env(
        safe-area-inset-bottom
      )
    );

  width: 100%;

  text-align: center;

  font-size: 10px;

  z-index: 15;

  pointer-events: none;
}

#buttons {
  position: absolute;

  left: 8px;
  right: 8px;

  bottom:
    calc(
      9px +
      env(
        safe-area-inset-bottom
      )
    );

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 6px;

  z-index: 30;
}

.mainButton {
  height: 47px;

  border: 2px solid #111;

  background: white;

  font-weight: bold;

  font-size: 10px;
}

#earnButton {
  background: #d43a35;
  color: white;
}

#upgradeButton {
  background: #edc842;
}

#gachaButton {
  background: #6ba7dd;
}

#plungerShopButton {
  background: #d95d4c;
  color: white;
}

#toast {
  position: absolute;

  left: 50%;

  top:
    calc(
      105px +
      env(safe-area-inset-top)
    );

  transform:
    translateX(-50%);

  background: #111;

  color: white;

  border: 2px solid white;

  padding: 9px 12px;

  font-size: 11px;

  min-width: 170px;

  max-width: 310px;

  text-align: center;

  display: none;

  z-index: 100;
}

/* =========================
   뚜러뻥 아이콘
========================= */

.plungerIcon {
  display: inline-block;

  position: relative;

  width: 15px;
  height: 20px;

  margin-right: 4px;

  vertical-align: middle;
}

.plungerIcon::before {
  content: "";

  position: absolute;

  width: 4px;
  height: 13px;

  left: 6px;
  top: 0;

  background: #87552f;

  border: 1px solid #111;
}

.plungerIcon::after {
  content: "";

  position: absolute;

  width: 14px;
  height: 7px;

  left: 1px;
  bottom: 0;

  background: #d63732;

  border: 2px solid #111;
}

/* =========================
   강화
========================= */

#upgradeOverlay,
#confirmOverlay {
  position: absolute;

  inset: 0;

  background:
    rgba(
      0,
      0,
      0,
      .62
    );

  z-index: 100;

  display: none;
}

.modal {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 290px;

  transform:
    translate(
      -50%,
      -50%
    );

  background: white;

  border: 4px solid #111;

  padding: 18px;

  text-align: center;
}

#upgradeMachine {
  position: relative;

  width: 150px;
  height: 100px;

  margin: auto;
}

#upgradeToilet {
  position: absolute;

  width: 64px;
  height: 48px;

  left: 43px;
  top: 28px;

  border: 4px solid #111;

  background: #eee;

  animation:
    shake
    .15s
    infinite
    alternate;
}

.upSpark {
  position: absolute;

  width: 8px;
  height: 8px;

  background: #efc52f;

  animation:
    flash
    .2s
    infinite
    alternate;
}

.upSpark:nth-child(1) {
  left: 10px;
  top: 25px;
}

.upSpark:nth-child(2) {
  right: 10px;
  top: 20px;
  animation-delay: .05s;
}

.upSpark:nth-child(3) {
  left: 72px;
  top: 4px;
  animation-delay: .1s;
}

.upSpark:nth-child(4) {
  left: 20px;
  bottom: 6px;
  animation-delay: .15s;
}

.upSpark:nth-child(5) {
  right: 22px;
  bottom: 7px;
  animation-delay: .08s;
}

@keyframes shake {
  from {
    transform:
      translateX(-3px);
  }

  to {
    transform:
      translateX(3px);
  }
}

@keyframes flash {
  from {
    transform:
      scale(.7);
  }

  to {
    transform:
      scale(1.7);
  }
}

.modalButton {
  height: 40px;

  min-width: 100px;

  margin: 10px 4px 0;

  border: 2px solid #111;

  background: white;

  font-weight: bold;
}

/* =========================
   페이지
========================= */

.pageScreen {
  background: #e6e6e6;

  overflow-y: auto;

  padding-bottom:
    env(safe-area-inset-bottom);
}

.pageHeader {
  position: sticky;

  top: 0;

  height:
    calc(
      65px +
      env(safe-area-inset-top)
    );

  padding-top:
    env(safe-area-inset-top);

  background: white;

  border-bottom:
    3px solid #111;

  z-index: 20;
}

.pageHeader h2 {
  margin: 0;

  padding: 20px 15px;

  font-size: 17px;
}

.backButton {
  position: absolute;

  right: 10px;

  top:
    calc(
      10px +
      env(safe-area-inset-top)
    );

  width: 72px;
  height: 42px;

  border: 2px solid #111;

  background: white;

  font-weight: bold;
}

/* =========================
   컬렉션
========================= */

#collectionList {
  padding: 9px;
}

.card {
  display: flex;

  align-items: center;

  min-height: 108px;

  background: white;

  border: 2px solid #111;

  margin-bottom: 8px;

  padding: 7px;

  gap: 8px;
}

.card canvas {
  width: 92px;
  height: 90px;

  border: 1px solid #aaa;

  flex: 0 0 auto;
}

.cardInfo {
  font-size: 10px;

  line-height: 1.55;
}

/* =========================
   가구
========================= */

#furnitureContent {
  padding: 10px;
}

.furnitureCard {
  background: white;

  border: 2px solid #111;

  padding: 10px;

  margin-bottom: 9px;
}

.furnitureTitle {
  font-weight: bold;

  font-size: 14px;
}

.furnitureDescription {
  margin: 7px 0;

  font-size: 11px;

  line-height: 1.5;
}

.buyFurniture {
  height: 38px;

  border: 2px solid #111;

  background: #efc842;

  font-weight: bold;
}

.buyFurniture:disabled {
  background: #bbb;
}

/* =========================
   뽑기
========================= */

#gachaScreen {
  background: #d7d7d7;
}

#gachaBack {
  position: absolute;

  left: 9px;

  top:
    calc(
      9px +
      env(safe-area-inset-top)
    );

  width: 70px;
  height: 42px;

  border: 2px solid #111;

  background: white;

  z-index: 20;
}

#gachaTitle {
  position: absolute;

  top:
    calc(
      18px +
      env(safe-area-inset-top)
    );

  width: 100%;

  text-align: center;

  font-weight: bold;

  z-index: 10;
}

#gachaCoins {
  position: absolute;

  right: 9px;

  top:
    calc(
      9px +
      env(safe-area-inset-top)
    );

  z-index: 20;
}

#gachaPull,
#openCapsule {
  position: absolute;

  left: 50%;

  bottom:
    calc(
      23px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  width: 220px;
  height: 58px;

  border: 3px solid #111;

  font-weight: bold;

  z-index: 30;
}

#gachaPull {
  background: #efc842;
  font-size: 15px;
}

#openCapsule {
  background: white;
  display: none;
}

#gachaResult {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(
      -50%,
      -50%
    );

  width: 290px;
  min-height: 280px;

  background: white;

  border: 4px solid #111;

  display: none;

  text-align: center;

  padding: 15px;

  z-index: 60;
}

#gachaResult.rareGlow {
  animation:
    rarePulse
    .55s
    infinite
    alternate;
}

@keyframes rarePulse {
  from {
    box-shadow:
      0 0 8px #fff,
      0 0 18px #f0c62e;
  }

  to {
    box-shadow:
      0 0 18px #fff,
      0 0 45px #f0c62e,
      0 0 75px #ffdf42;
  }
}

#resultCanvas {
  width: 130px;
  height: 105px;
}

#resultName {
  font-size: 18px;

  font-weight: bold;

  margin-top: 5px;
}

#resultAbility {
  margin-top: 10px;

  font-size: 11px;

  line-height: 1.5;
}

/* 아주 작은 화면 대응 */

@media
(max-height: 650px) {

  .mainButton {
    height: 40px;
  }

  #buttons {
    gap: 4px;
  }

  #moveHelp {
    bottom:
      calc(
        140px +
        env(
          safe-area-inset-bottom
        )
      );
  }

  #stats {
    font-size: 9px;
  }

}
</style>
</head>

<body>

<div id="game">

  <div
    id="startScreen"
    class="screen active"
  >

    <div id="title">
      변기키우기
    </div>

    <div id="subtitle">
      나만의 이상한 화장실
    </div>

    <input
      id="nameInput"
      maxlength="10"
      placeholder="플레이어 이름"
    >

    <button id="startButton">
      게임 시작
    </button>

  </div>


  <div
    id="mainScreen"
    class="screen"
  >

    <canvas id="mainCanvas"></canvas>

    <div id="topBar">

      <div
        id="coinBox"
        class="pixelBox"
      >

        <div id="coinIcon"></div>

        <span id="coinText">
          0
        </span>

      </div>

      <div
        id="playerName"
        class="pixelBox"
      >
        PLAYER
      </div>

    </div>

    <div
      id="stats"
      class="pixelBox"
    >
      획득량 1 / 쿨타임 1.0초 / 강화 35%
    </div>

    <div
      id="plungerInfo"
      class="pixelBox"
    >

      <span class="plungerIcon"></span>

      <span id="plungerCount">
        0
      </span>

    </div>

    <div id="moveHelp">
      빈 곳 두 번 터치: 이동 / 움직이는 변기 한 번 터치: 뚜러뻥
    </div>

    <div id="buttons">

      <button
        id="earnButton"
        class="mainButton"
      >
        돈벌기
      </button>

      <button
        id="upgradeButton"
        class="mainButton"
      >
        강화
      </button>

      <button
        id="gachaButton"
        class="mainButton"
      >
        변기 뽑기
      </button>

      <button
        id="collectionButton"
        class="mainButton"
      >
        보유 변기
      </button>

      <button
        id="furnitureButton"
        class="mainButton"
      >
        가구 상점
      </button>

      <button
        id="plungerShopButton"
        class="mainButton"
      >
        뚜러뻥 50
      </button>

    </div>

    <div id="toast"></div>


    <div id="upgradeOverlay">

      <div class="modal">

        <div id="upgradeMachine">

          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>

          <div id="upgradeToilet"></div>

        </div>

        <div id="upgradeMessage">
          강화 중...
        </div>

        <button
          id="upgradeClose"
          class="modalButton"
          style="display:none"
        >
          확인
        </button>

      </div>

    </div>


    <div id="confirmOverlay">

      <div class="modal">

        <div
          style="
            font-size:17px;
            font-weight:bold;
            margin-bottom:12px;
          "
        >
          뚜러뻥
        </div>

        <div
          id="confirmText"
          style="
            font-size:12px;
            line-height:1.6;
          "
        ></div>

        <button
          id="confirmYes"
          class="modalButton"
        >
          사용한다
        </button>

        <button
          id="confirmNo"
          class="modalButton"
        >
          안 한다
        </button>

      </div>

    </div>

  </div>


  <div
    id="gachaScreen"
    class="screen"
  >

    <canvas id="gachaCanvas"></canvas>

    <button id="gachaBack">
      뒤로
    </button>

    <div id="gachaTitle">
      변기 뽑기
    </div>

    <div
      id="gachaCoins"
      class="pixelBox"
    >
      COIN
      <span id="gachaCoinText">
        0
      </span>
    </div>

    <button id="gachaPull">
      30 COIN 뽑기
    </button>

    <button id="openCapsule">
      캡슐 열기
    </button>

    <div id="gachaResult">

      <canvas
        id="resultCanvas"
        width="130"
        height="105"
      ></canvas>

      <div id="resultName"></div>

      <div id="resultAbility"></div>

      <button
        id="resultClose"
        class="modalButton"
      >
        확인
      </button>

    </div>

  </div>


  <div
    id="collectionScreen"
    class="screen pageScreen"
  >

    <div class="pageHeader">

      <h2>
        보유 변기
      </h2>

      <button
        id="collectionBack"
        class="backButton"
      >
        뒤로
      </button>

    </div>

    <div id="collectionList"></div>

  </div>


  <div
    id="furnitureScreen"
    class="screen pageScreen"
  >

    <div class="pageHeader">

      <h2>
        가구 상점
      </h2>

      <button
        id="furnitureBack"
        class="backButton"
      >
        뒤로
      </button>

    </div>

    <div id="furnitureContent"></div>

  </div>

</div>


<script>

/* =========================
   화면
========================= */

const screens = {
  start:
    document.getElementById(
      "startScreen"
    ),

  main:
    document.getElementById(
      "mainScreen"
    ),

  gacha:
    document.getElementById(
      "gachaScreen"
    ),

  collection:
    document.getElementById(
      "collectionScreen"
    ),

  furniture:
    document.getElementById(
      "furnitureScreen"
    )
};


function showScreen(name) {

  Object
    .values(screens)
    .forEach(
      screen => {

        screen
          .classList
          .remove("active");

      }
    );


  screens[name]
    .classList
    .add("active");


  if (name === "main") {

    resizeMainCanvas();

  }


  if (name === "gacha") {

    resizeGachaCanvas();

  }

}

  document.getElementById(
    "coinText"

  );

  document.getElementById(
    "plungerCount"
  );


function calculateIncome() {

  let result =
    moneyPower;


  characters.forEach(
    (character,index) => {

      let amount =
        owned[index];


      if (index === 0) {

        amount =
          Math.max(
            0,
            amount - 1
          );

      }


      result +=
        (
          character.buffIncome ||
          0
        ) *
        amount;


      result -=
        (
          character.debuffIncome ||
          0
        ) *
        amount;

    }
  );


  return Math.max(
    1,
    Math.floor(result)
  );

}


function calculateCooldown() {

  let result =
    earnCooldown;


  characters.forEach(
    (character,index) => {

      let amount =
        owned[index];


      if (index === 0) {

        amount =
          Math.max(
            0,
            amount - 1
          );

      }


      result -=
        (
          character.cooldownBuff ||
          0
        ) *
        amount;


      result +=
        (
          character.debuffCooldown ||
          0
        ) *
        amount;

    }
  );


  return Math.max(
    .1,
    result
  );

}


function updateUI() {

  coinText.textContent =
    Math.floor(coins);

  gachaCoinText.textContent =
    Math.floor(coins);

  plungerCount.textContent =
    plungers;

  stats.textContent =
    "획득량 " +
    calculateIncome() +
    " / 쿨타임 " +
    calculateCooldown()
      .toFixed(1) +
    "초 / 강화 35%";

}

const mainCanvas =
  document.getElementById(
    "mainCanvas"
  );

const ctx =
  mainCanvas.getContext(
    "2d"
  );


function resizeMainCanvas() {

  mainCanvas.width =
    mainCanvas.clientWidth;

  mainCanvas.height =
    mainCanvas.clientHeight;

}


const player = {

  x: 180,
  y: 340,

  targetX: 180,
  targetY: 340,

  speed: 3,

  moving: false,

  direction: 1

};


function pointerPosition(
  canvas,
  event
) {

  const rect =
    canvas
      .getBoundingClientRect();


  return {

    x:
      (
        event.clientX -
        rect.left
      )
      *
      canvas.width
      /
      rect.width,

    y:
      (
        event.clientY -
        rect.top
      )
      *
      canvas.height
      /
      rect.height

  };

}


/* =========================
   이동 + 뚜러뻥 선택
========================= */

let lastTap =
  0;

let selectedRemoveIndex =
  null;


mainCanvas
  .addEventListener(
    "pointerdown",
    event => {

      const pos =
        pointerPosition(
          mainCanvas,
          event
        );


      for (
        let i =
          roamingCharacters.length - 1;

        i >= 0;

        i--
      ) {

        const character =
          roamingCharacters[i];


        if (
          pos.x >=
          character.x - 5
          &&
          pos.x <=
          character.x + 70
          &&
          pos.y >=
          character.y - 5
          &&
          pos.y <=
          character.y + 75
        ) {

          openPlungerConfirm(
            i
          );

          return;

        }

      }


      const now =
        Date.now();


      if (
        now - lastTap <
        320
      ) {

        player.targetX =
          Math.max(
            5,
            Math.min(
              mainCanvas.width -
              70,
              pos.x - 30
            )
          );


        player.targetY =
          Math.max(
            115,
            Math.min(
              mainCanvas.height -
              175,
              pos.y - 35
            )
          );


        player.direction =
          player.targetX <
          player.x
          ? -1
          : 1;


        player.moving =
          true;

      }


      lastTap =
        now;

    }
  );


function updatePlayer() {

  if (!player.moving) {
    return;
  }


  const dx =
    player.targetX -
    player.x;

  const dy =
    player.targetY -
    player.y;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if (distance < 3) {

    player.x =
      player.targetX;

    player.y =
      player.targetY;

    player.moving =
      false;

    return;

  }


  player.x +=
    dx /
    distance *
    player.speed;


  player.y +=
    dy /
    distance *
    player.speed;

}

  ctx.fillRect(
    0,
    116,
    mainCanvas.width,
    mainCanvas.height -
    116
  );


  const tile =
    43;


  ctx.strokeStyle =
    "#bdbdbd";


  for (
    let x = 0;
    x < mainCanvas.width;
    x += tile
  ) {

    ctx.beginPath();


    ctx.moveTo(
      x,
      116
    );


    ctx.lineTo(
      x,
      mainCanvas.height
    );


    ctx.stroke();

  }


  for (
    let y = 116;
    y < mainCanvas.height;
    y += tile
  ) {

    ctx.beginPath();


    ctx.moveTo(
      0,
      y
    );


    ctx.lineTo(
      mainCanvas.width,
      y
    );


    ctx.stroke();

  }

}

========================= */

function addRoamingCharacter(
  characterIndex
) {

  const angle =
    Math.random() *
    Math.PI *
    2;


  roamingCharacters.push({

    characterIndex,

    x:
      15 +
      Math.random() *
      Math.max(
        30,
        mainCanvas.width -
        90
      ),

    y:
      135 +
      Math.random() *
      Math.max(
        80,
        mainCanvas.height -
        340
      ),

    vx:
      Math.cos(angle) *
      (
        .25 +
        Math.random() *
        .4
      ),

    vy:
      Math.sin(angle) *
      (
        .25 +
        Math.random() *
        .4
      ),

    phase:
      Math.random() *
      10

  });

}


function updateRoaming() {

  roamingCharacters
    .forEach(
      character => {

        character.x +=
          character.vx;


        character.y +=
          character.vy;


        if (
          character.x < 2
          ||
          character.x >
          mainCanvas.width -
          70
        ) {

          character.vx *=
            -1;

        }


        if (
          character.y < 120
          ||
          character.y >
          mainCanvas.height -
          180
        ) {

          character.vy *=
            -1;

        }


        character.phase +=
          .05;

      }
    );

}

    );


  roamingCharacters
    .forEach(
      character => {

        drawCharacter(
          ctx,
          characters[
            character.characterIndex
          ],
          character.x,
          character.y +
          Math.sin(
            character.phase
          ) *
          1.5
        );

      }
    );


  const bounce =
    player.moving
    ?
    Math.sin(
      performance.now() /
      90
    ) *
    2
    :
    0;


  ctx.save();


  if (
    player.direction < 0
  ) {

    ctx.translate(
      player.x + 65,
      0
    );


    ctx.scale(
      -1,
      1
    );


    drawCharacter(
      ctx,
      characters[0],
      0,
      player.y +
      bounce
    );

  } else {

    drawCharacter(
      ctx,
      characters[0],
      player.x,
      player.y +
      bounce
    );

  }


  ctx.restore();


  ctx.fillStyle =
    "#111";

  );

        "falling"
      ) {

        return;

      }


      showScreen(
        "main"
      );

    }
  );


gachaPull
  .addEventListener(
    "click",
    () => {

      if (
        gachaState !==
        "idle"
      ) {

        return;

      }


      if (
        coins <
        30
      ) {

        alert(
          "코인이 부족합니다."
        );

        return;

      }


      coins -=
        30;


      currentGacha =
        randomCharacter();


      capsuleY =
        245;


      gachaState =
        "falling";


      gachaPull
        .style
        .display =
          "none";


      updateUI();


      setTimeout(
        () => {

          gachaState =
            "ready";


          openCapsule
            .style
            .display =
              "block";

        },
        1200
      );

    }
  );


openCapsule
  .addEventListener(
    "click",
    () => {

      const character =
        characters[
          currentGacha
        ];


      owned[
        currentGacha
      ]++;


      addRoamingCharacter(
        currentGacha
      );


      resultContext
        .clearRect(
          0,
          0,
          130,
          105
        );


      if (
        character.gold
        ||
        character.rarity ===
        "레어"
      ) {

        gachaResult
          .classList
          .add(
            "rareGlow"
          );


        for (
          let i = 0;
          i < 10;
          i++
        ) {

          const angle =
            Math.PI *
            2 /
            10 *
            i;


          resultContext
            .fillStyle =
              i % 2 === 0
              ?
              "#f1c52c"
              :
              "#fff1a0";


          resultContext
            .fillRect(
              65 +
              Math.cos(angle) *
              46,
              53 +
              Math.sin(angle) *
              38,
              6,
              6
            );

        }

      } else {

        gachaResult
          .classList
          .remove(
            "rareGlow"
          );

      }


      drawCharacter(
        resultContext,
        character,
        33,
        15
      );


      document
        .getElementById(
          "resultName"
        )
        .textContent =
          character.name +
          " / " +
          character.rarity;


      document
        .getElementById(
          "resultAbility"
        )
        .innerHTML =
          "<b>" +
          character.ability +
          "</b><br>" +
          character.description;


      gachaResult
        .style
        .display =
          "block";


      openCapsule
        .style
        .display =
          "none";


      gachaState =
        "result";


      updateUI();

    }
  );


document
  .getElementById(
    "resultClose"
  )
  .addEventListener(
    "click",
    () => {

      gachaResult
        .style
        .display =
          "none";


      gachaResult
        .classList
        .remove(
          "rareGlow"
        );


      gachaPull
        .style
        .display =
          "block";


      gachaState =
        "idle";


      currentGacha =
        null;

    }
  );


/* =========================
   컬렉션
========================= */

document
  .getElementById(
    "collectionButton"
  )
  .addEventListener(
    "click",
    () => {

      buildCollection();

      showScreen(
        "collection"
      );

    }
  );


document
  .getElementById(
    "collectionBack"
  )
  .addEventListener(
    "click",
    () => {

      showScreen(
        "main"
      );

    }
  );


function buildCollection() {

  const list =
    document.getElementById(
      "collectionList"
    );


  list.innerHTML =
    "";


  characters.forEach(
    (character,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        92;

      canvas.height =
        90;


      const cctx =
        canvas.getContext(
          "2d"
        );


      if (
        owned[index] > 0
      ) {

        drawCharacter(
          cctx,
          character,
          14,
          8
        );

      } else {

        cctx.fillStyle =
          "#222";


        cctx.font =
          "40px monospace";


        cctx.fillText(
          "?",
          33,
          57
        );

      }


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "cardInfo";


      if (
        owned[index] > 0
      ) {

        info.innerHTML =
          "<b>" +
          character.name +
          "</b><br>" +
          "등급: " +
          character.rarity +
          "<br>" +
          "보유: " +
          owned[index] +
          "개<br>" +
          "<b>" +
          character.ability +
          "</b><br>" +
          character.description;


        if (
          character.negative
        ) {

          info.innerHTML +=
            "<br><b>디버프 적용 중</b>";

        }

      } else {

        info.innerHTML =
          "<b>미발견 캐릭터</b>" +
          "<br>???<br>" +
          "보유 0개";

      }


      card.appendChild(
        canvas
      );


      card.appendChild(
        info
      );


      list.appendChild(
        card
      );

    }
  );

}


/* =========================
   가구 상점
========================= */

document
  .getElementById(
    "furnitureButton"
  )
  .addEventListener(
    "click",
    () => {

      buildFurnitureShop();

      showScreen(
        "furniture"
      );

    }
  );


document
  .getElementById(
    "furnitureBack"
  )
  .addEventListener(
    "click",
    () => {

      showScreen(
        "main"
      );

    }
  );


function buildFurnitureShop() {

  const content =
    document.getElementById(
      "furnitureContent"
    );


  content.innerHTML =
    "";


  furnitureCatalog.forEach(
    (item,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "furnitureCard";


      const purchased =
        purchasedFurniture[
          index
        ];


      card.innerHTML =
        '<div class="furnitureTitle">' +
        item.name +
        '</div>' +
        '<div class="furnitureDescription">' +
        item.description +
        '<br>가격: ' +
        item.price +
        ' 코인</div>';


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "buyFurniture";


      button.textContent =
        purchased
        ?
        "구매 완료"
        :
        item.price +
        " COIN 구매";


      button.disabled =
        purchased;


      button.addEventListener(
        "click",
        () => {

          if (
            purchasedFurniture[
              index
            ]
          ) {

            return;

          }


          if (
            coins <
            item.price
          ) {

            alert(
              "코인이 부족합니다."
            );

            return;

          }


          coins -=
            item.price;


          purchasedFurniture[
            index
          ] =
            true;


          placedFurniture.push({

            type:
              item.type,

            x:
              45 +
              Math.random() *
              Math.max(
                40,
                mainCanvas.width -
                100
              ),

            y:
              170 +
              Math.random() *
              Math.max(
                60,
                mainCanvas.height -
                400
              )

          });


          startFurnitureEffect(
            item
          );


          updateUI();

          buildFurnitureShop();

        }
      );


      card.appendChild(
        button
      );


      content.appendChild(
        card
      );

    }
  );

}


function startFurnitureEffect(
  item
) {

  setInterval(
    () => {

      let gain;


      if (
        item.doubleIncome
      ) {

        gain =
          calculateIncome() *
          2;

      } else {

        gain =
          item.income;

      }


      coins +=
        gain;


      updateUI();

    },
    item.interval
  );

}


/* =========================
   메인 루프
========================= */

function loop() {

  if (
    screens.main
      .classList
      .contains(
        "active"
      )
  ) {

    updatePlayer();

    updateRoaming();

    drawMain();

  }


  if (
    screens.gacha
      .classList
      .contains(
        "active"
      )
  ) {

    if (
      gachaState ===
      "falling"
    ) {

      capsuleY +=
        4.3;


      if (
        capsuleY >
        515
      ) {

        capsuleY =
          515;

      }

    }


    drawGacha();

  }


  requestAnimationFrame(
    loop
  );

}


/* =========================
   Safari 주소창 높이 대응
========================= */

function refreshGameHeight() {

  /*
    100dvh를 지원하는 브라우저에서는
    CSS가 알아서 처리한다.

    일부 구형 Safari를 위해
    실제 innerHeight도 변수로 저장.
  */

  document
    .documentElement
    .style
    .setProperty(
      "--real-height",
      window.innerHeight +
      "px"
    );


  resizeMainCanvas();

  resizeGachaCanvas();

}


window.addEventListener(
  "resize",
  refreshGameHeight
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      refreshGameHeight,
      200
    );

  }
);


if (
  window.visualViewport
) {

  window.visualViewport
    .addEventListener(
      "resize",
      refreshGameHeight
    );

}


/* =========================
   시작
========================= */

refreshGameHeight();

updateUI();

loop();

    pxRect(c,x-55,385,110,65,"#705039");pxRect(c,x-14,397,28,35,"#d6b744");c.fillStyle="#493224";c.fillRect(x+70,390,48,10);c.fillRect(x+105,390,10,55);c.fillStyle="#d8c29a";c.fillRect(x+101,438,18,18);
    pxRect(c,x-55,478,110,70,"#4c4038");pixelLabel(c,"OLD",x,472,"#fff0b5");machineCapsule(c,x,capsuleY)

  function drawRareMachine(c,w,h,t){const x=w/2;c.fillStyle="#b9dcf0";c.fillRect(0,0,w,h);for(let y=80;y<h;y+=34){c.fillStyle="rgba(255,255,255,.28)";c.fillRect(0,y,w,2)}

    for(let i=0;i<10;i++){c.fillStyle=i%2?"#207fc0":"#d9fbff";c.fillRect(x-76+(i%5)*35,252+Math.floor(i/5)*50,20,20)}
    pxRect(c,x-76,382,152,68,"#153d68");c.fillStyle="#78eeff";c.fillRect(x-58,398,116,8);c.fillRect(x-58,420,74,8);pxRect(c,x+39,411,27,27,"#eafcff");
    pxRect(c,x-57,482,114,68,"#102d4d");c.strokeStyle="#87efff";c.lineWidth=3;c.strokeRect(x-107,214,214,332);seededParticles(c,x,325,"#65e8ff",8,105,t*.4);machineCapsule(c,x,capsuleY)

  function drawEpicMachine(c,w,h,t){const x=w/2;c.fillStyle="#eadb9e";c.fillRect(0,0,w,h);c.fillStyle="#c69a22";for(let y=90;y<h;y+=48)c.fillRect(0,y,w,3);seededParticles(c,x,330,"#ffd84a",22,180,t);
    pxRect(c,x-120,215,240,340,"#d29e16");c.fillStyle="#fff0a0";c.fillRect(x-108,229,216,25);c.fillRect(x-108,518,216,22);pxRect(c,x-92,260,184,105,"#6e4710");c.fillStyle="#ffe279";c.beginPath();c.arc(x,316,76,Math.PI,0);c.fill();
    for(let i=0;i<8;i++){c.fillStyle=i%2?"#fff2aa":"#edb91f";c.fillRect(x-67+(i%4)*42,295+Math.floor(i/4)*31,20,20)}
    pxRect(c,x-70,390,140,66,"#7a5010");c.fillStyle="#fff1a2";c.fillRect(x-49,408,98,12);pxRect(c,x+77,383,34,70,"#f5c62f");c.fillStyle="#fff5bd";c.fillRect(x+83,391,22,18);pxRect(c,x-58,480,116,65,"#6a460d");machineCapsule(c,x,capsuleY)

  function crystal(c,cx,cy,size,color,split){c.fillStyle="#111";c.beginPath();c.moveTo(cx,cy-size-5);c.lineTo(cx+size+5,cy);c.lineTo(cx+size/2,cy+size+8);c.lineTo(cx-size/2,cy+size+8);c.lineTo(cx-size-5,cy);c.closePath();c.fill();c.fillStyle=color;c.beginPath();c.moveTo(cx,cy-size);c.lineTo(cx+size,cy);c.lineTo(cx+size/2,cy+size);c.lineTo(cx-size/2,cy+size);c.lineTo(cx-size,cy);c.closePath();c.fill();if(split){c.strokeStyle="#fff";c.lineWidth=4;c.beginPath();c.moveTo(cx+3,cy-size+8);c.lineTo(cx-6,cy-4);c.lineTo(cx+8,cy+10);c.lineTo(cx-2,cy+size-4);c.stroke()}}
  function drawLegendAltar(c,w,h,t){const x=w/2;c.fillStyle="#18203d";c.fillRect(0,0,w,h);for(let i=0;i<26;i++){c.fillStyle=i%4?"#51659a":"#fff";c.fillRect((i*97)%w,70+(i*61)%(h-100),2,2)}seededParticles(c,x,300,"#a7f5ff",18,160,t*.5);
    c.fillStyle="#252d55";c.beginPath();c.moveTo(20,550);c.lineTo(x,410);c.lineTo(w-20,550);c.fill();pxRect(c,x-145,492,290,56,"#42558b");pxRect(c,x-105,447,210,43,"#718bc0");pxRect(c,x-68,414,136,31,"#a8d8e8");
    const opening=gachaState==="falling"||gachaState==="ready";crystal(c,x,292,82,opening?"#dfffff":"#75d9ed",opening);crystal(c,x-103,392,34,"#6dbcd8",false);crystal(c,x+103,392,34,"#6dbcd8",false);pixelLabel(c,opening?"수정이 갈라지고 있다":"수정 제단",x,585,"#dffaff");if(gachaState==="falling")drawCapsule(c,x,capsuleY,27);else if(gachaState==="ready")drawCapsule(c,x,410,27)
  }
  function drawCthulhuPortal(c,w,h,t){const x=w/2,cy=330;c.fillStyle="#07040f";c.fillRect(0,0,w,h);for(let i=0;i<48;i++){const tw=(Math.sin(t*3+i)+1)/2;c.fillStyle=i%7===0?`rgba(126,255,203,${.4+tw*.6})`:`rgba(190,150,255,${.25+tw*.5})`;c.fillRect((i*89)%w,55+(i*53)%(h-80),i%9===0?4:2,i%9===0?4:2)}
    c.strokeStyle="#201032";c.lineWidth=32;c.beginPath();c.arc(x,cy,125,0,Math.PI*2);c.stroke();c.strokeStyle="#6e2e9f";c.lineWidth=18;c.beginPath();c.arc(x,cy,105,t,t+Math.PI*1.55);c.stroke();c.strokeStyle="#48c596";c.lineWidth=9;c.beginPath();c.arc(x,cy,83,-t*.7,-t*.7+Math.PI*1.45);c.stroke();
    const grad=c.createRadialGradient(x,cy,5,x,cy,74);grad.addColorStop(0,"#000");grad.addColorStop(.55,"#170926");grad.addColorStop(1,"#4b176a");c.fillStyle=grad;c.beginPath();c.arc(x,cy,75,0,Math.PI*2);c.fill();
    c.strokeStyle="#8b48c7";c.lineWidth=3;for(let i=0;i<7;i++){const a=i*Math.PI*2/7+t*.25;c.beginPath();c.moveTo(x+Math.cos(a)*132,cy+Math.sin(a)*132);c.lineTo(x+Math.cos(a+.25)*170,cy+Math.sin(a+.25)*170);c.stroke()}seededParticles(c,x,cy,"#70e9b4",18,145,-t);
    c.fillStyle="#8aa1d4";c.beginPath();c.arc(x+128,cy-104,21,0,Math.PI*2);c.fill();c.fillStyle="#4f336e";c.beginPath();c.arc(x+121,cy-111,21,0,Math.PI*2);c.fill();pixelLabel(c,"심연의 우주 포털",x,545,"#aefcdb");if(gachaState==="falling")drawCapsule(c,x,cy,Math.max(8,27-(515-capsuleY)/18));else if(gachaState==="ready")drawCapsule(c,x,cy,27)
  }
  drawGacha=function(){const w=gachaCanvas.width,h=gachaCanvas.height,t=performance.now()/1000;gctx.clearRect(0,0,w,h);if(currentZone==="일반")drawNormalMachine(gctx,w,h,t);else if(currentZone==="레어")drawRareMachine(gctx,w,h,t);else if(currentZone==="에픽")drawEpicMachine(gctx,w,h,t);else if(currentZone==="레전더리")drawLegendAltar(gctx,w,h,t);else drawCthulhuPortal(gctx,w,h,t)};

  const start=cloneButton("startButton");start.onclick=()=>{const input=document.getElementById("nameInput").value.trim();playerNameValue=input||"PLAYER";document.getElementById("playerName").textContent=playerNameValue;showScreen("main");save();updateUI()};
  window.addEventListener("beforeunload",save);load();uniqueRoamers();updateUI();
})();
