<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>
<title>변기키우기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: monospace;
}

button,
input {
  font-family: monospace;
}

button {
  cursor: pointer;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 430px;
  margin: auto;
  overflow: hidden;
  background: white;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: block;
}

canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* 시작 */

#startScreen {
  background: white;
  text-align: center;
}

#title {
  margin-top: 25vh;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
}

#subtitle {
  margin-top: 10px;
  font-size: 12px;
}

#nameInput {
  width: 230px;
  height: 50px;
  display: block;
  margin: 50px auto 15px;
  border: 3px solid #111;
  outline: none;
  text-align: center;
  font-size: 16px;
}

#startButton {
  width: 210px;
  height: 58px;
  background: white;
  border: 3px solid #111;
  font-weight: bold;
  font-size: 16px;
}

/* 메인 */

#mainCanvas,
#gachaCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#topBar {
  position: absolute;
  left: 8px;
  right: 8px;
  top: 8px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 20;
}

.pixelBox {
  border: 2px solid #111;
  background: rgba(255,255,255,.95);
  padding: 7px 9px;
  font-size: 11px;
  font-weight: bold;
}

#coinBox {
  display: flex;
  align-items: center;
  min-width: 90px;
}

#coinIcon {
  position: relative;
  width: 21px;
  height: 21px;
  border: 2px solid #111;
  background: #f0c52d;
  margin-right: 6px;
}

#coinIcon:after {
  content: "";
  position: absolute;
  left: 6px;
  top: 3px;
  width: 5px;
  height: 9px;
  border: 2px solid #916510;
}

#stats {
  position: absolute;
  left: 50%;
  top: 58px;
  transform: translateX(-50%);
  z-index: 20;
  white-space: nowrap;
}

#moveHelp {
  position: absolute;
  bottom: 165px;
  width: 100%;
  text-align: center;
  font-size: 10px;
  z-index: 15;
  pointer-events: none;
}

#buttons {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 9px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  z-index: 30;
}

.mainButton {
  height: 47px;
  border: 2px solid #111;
  background: white;
  font-weight: bold;
  font-size: 10px;
}

#earnButton {
  background: #d43a35;
  color: white;
}

#upgradeButton {
  background: #edc842;
}

#gachaButton {
  background: #6ba7dd;
}

#plungerShopButton {
  background: #d95d4c;
  color: white;
}

#toast {
  position: absolute;
  left: 50%;
  top: 105px;
  transform: translateX(-50%);
  background: #111;
  color: white;
  border: 2px solid white;
  padding: 9px 12px;
  font-size: 11px;
  min-width: 170px;
  max-width: 310px;
  text-align: center;
  display: none;
  z-index: 100;
}

/* 강화 */

#upgradeOverlay,
#confirmOverlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.62);
  z-index: 100;
  display: none;
}

.modal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 290px;
  transform: translate(-50%,-50%);
  background: white;
  border: 4px solid #111;
  padding: 18px;
  text-align: center;
}

#upgradeMachine {
  position: relative;
  width: 150px;
  height: 100px;
  margin: auto;
}

#upgradeToilet {
  position: absolute;
  width: 64px;
  height: 48px;
  left: 43px;
  top: 28px;
  border: 4px solid #111;
  background: #eee;
  animation: shake .15s infinite alternate;
}

.upSpark {
  position: absolute;
  width: 8px;
  height: 8px;
  background: #efc52f;
  animation: flash .2s infinite alternate;
}

.upSpark:nth-child(1) { left: 10px; top: 25px; }
.upSpark:nth-child(2) { right: 10px; top: 20px; animation-delay:.05s; }
.upSpark:nth-child(3) { left: 72px; top: 4px; animation-delay:.1s; }
.upSpark:nth-child(4) { left: 20px; bottom: 6px; animation-delay:.15s; }
.upSpark:nth-child(5) { right: 22px; bottom: 7px; animation-delay:.08s; }

@keyframes shake {
  from { transform: translateX(-3px); }
  to { transform: translateX(3px); }
}

@keyframes flash {
  from { transform: scale(.7); }
  to { transform: scale(1.7); }
}

.modalButton {
  height: 40px;
  min-width: 100px;
  margin: 10px 4px 0;
  border: 2px solid #111;
  background: white;
  font-weight: bold;
}

/* 페이지 */

.pageScreen {
  background: #e6e6e6;
  overflow-y: auto;
}

.pageHeader {
  position: sticky;
  top: 0;
  height: 65px;
  background: white;
  border-bottom: 3px solid #111;
  z-index: 20;
}

.pageHeader h2 {
  margin: 0;
  padding: 20px 15px;
  font-size: 17px;
}

.backButton {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 72px;
  height: 42px;
  border: 2px solid #111;
  background: white;
  font-weight: bold;
}

/* 컬렉션 */

#collectionList {
  padding: 9px;
}

.card {
  display: flex;
  align-items: center;
  min-height: 108px;
  background: white;
  border: 2px solid #111;
  margin-bottom: 8px;
  padding: 7px;
  gap: 8px;
}

.card canvas {
  width: 92px;
  height: 90px;
  border: 1px solid #aaa;
  flex: 0 0 auto;
}

.cardInfo {
  font-size: 10px;
  line-height: 1.55;
}

/* 가구 */

#furnitureContent {
  padding: 10px;
}

.furnitureCard {
  background: white;
  border: 2px solid #111;
  padding: 10px;
  margin-bottom: 9px;
}

.furnitureTitle {
  font-weight: bold;
  font-size: 14px;
}

.furnitureDescription {
  margin: 7px 0;
  font-size: 11px;
  line-height: 1.5;
}

.buyFurniture {
  height: 38px;
  border: 2px solid #111;
  background: #efc842;
  font-weight: bold;
}

.buyFurniture:disabled {
  background: #bbb;
}

/* 뽑기 */

#gachaScreen {
  background: #d7d7d7;
}

#gachaBack {
  position: absolute;
  left: 9px;
  top: 9px;
  width: 70px;
  height: 42px;
  border: 2px solid #111;
  background: white;
  z-index: 20;
}

#gachaTitle {
  position: absolute;
  top: 18px;
  width: 100%;
  text-align: center;
  font-weight: bold;
  z-index: 10;
}

#gachaCoins {
  position: absolute;
  right: 9px;
  top: 9px;
  z-index: 20;
}

#gachaPull {
  position: absolute;
  left: 50%;
  bottom: 23px;
  transform: translateX(-50%);
  width: 220px;
  height: 58px;
  border: 3px solid #111;
  background: #efc842;
  font-size: 15px;
  font-weight: bold;
  z-index: 30;
}

#openCapsule {
  position: absolute;
  left: 50%;
  bottom: 23px;
  transform: translateX(-50%);
  width: 220px;
  height: 58px;
  border: 3px solid #111;
  background: white;
  font-weight: bold;
  display: none;
  z-index: 30;
}

#gachaResult {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 290px;
  min-height: 280px;
  background: white;
  border: 4px solid #111;
  display: none;
  text-align: center;
  padding: 15px;
  z-index: 60;
}

#gachaResult.rareGlow {
  animation: rarePulse .55s infinite alternate;
}

@keyframes rarePulse {
  from {
    box-shadow:
      0 0 8px #fff,
      0 0 18px #f0c62e;
  }
  to {
    box-shadow:
      0 0 18px #fff,
      0 0 45px #f0c62e,
      0 0 75px #ffdf42;
  }
}

#resultCanvas {
  width: 130px;
  height: 105px;
}

#resultName {
  font-size: 18px;
  font-weight: bold;
  margin-top: 5px;
}

#resultAbility {
  margin-top: 10px;
  font-size: 11px;
  line-height: 1.5;
}

/* 뚜러뻥 표시 */

#plungerInfo {
  position: absolute;
  right: 8px;
  top: 58px;
  z-index: 20;
}

.plungerIcon {
  display: inline-block;
  position: relative;
  width: 15px;
  height: 20px;
  margin-right: 4px;
  vertical-align: middle;
}

.plungerIcon:before {
  content: "";
  position: absolute;
  width: 4px;
  height: 13px;
  left: 6px;
  top: 0;
  background: #87552f;
  border: 1px solid #111;
}

.plungerIcon:after {
  content: "";
  position: absolute;
  width: 14px;
  height: 7px;
  left: 1px;
  bottom: 0;
  background: #d63732;
  border: 2px solid #111;
}
</style>
</head>

<body>

<div id="game">

  <!-- 시작 -->
  <div id="startScreen" class="screen active">

    <div id="title">변기키우기</div>
    <div id="subtitle">나만의 이상한 화장실</div>

    <input
      id="nameInput"
      maxlength="10"
      placeholder="플레이어 이름"
    >

    <button id="startButton">
      게임 시작
    </button>

  </div>


  <!-- 메인 -->
  <div id="mainScreen" class="screen">

    <canvas id="mainCanvas"></canvas>

    <div id="topBar">

      <div id="coinBox" class="pixelBox">
        <div id="coinIcon"></div>
        <span id="coinText">0</span>
      </div>

      <div id="playerName" class="pixelBox">
        PLAYER
      </div>

    </div>

    <div id="stats" class="pixelBox">
      획득량 1 / 쿨타임 1.0초 / 강화 35%
    </div>

    <div id="plungerInfo" class="pixelBox">
      <span class="plungerIcon"></span>
      <span id="plungerCount">0</span>
    </div>

    <div id="moveHelp">
      빈 곳 두 번 터치: 이동 / 돌아다니는 변기 한 번 터치: 뚜러뻥
    </div>

    <div id="buttons">

      <button id="earnButton" class="mainButton">
        돈벌기
      </button>

      <button id="upgradeButton" class="mainButton">
        강화
      </button>

      <button id="gachaButton" class="mainButton">
        변기 뽑기
      </button>

      <button id="collectionButton" class="mainButton">
        보유 변기
      </button>

      <button id="furnitureButton" class="mainButton">
        가구 상점
      </button>

      <button id="plungerShopButton" class="mainButton">
        뚜러뻥 50
      </button>

    </div>

    <div id="toast"></div>


    <!-- 강화 -->
    <div id="upgradeOverlay">

      <div class="modal">

        <div id="upgradeMachine">
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div class="upSpark"></div>
          <div id="upgradeToilet"></div>
        </div>

        <div id="upgradeMessage">
          강화 중...
        </div>

        <button
          id="upgradeClose"
          class="modalButton"
          style="display:none"
        >
          확인
        </button>

      </div>

    </div>


    <!-- 뚜러뻥 확인 -->
    <div id="confirmOverlay">

      <div class="modal">

        <div
          id="confirmTitle"
          style="font-size:17px;font-weight:bold;margin-bottom:12px"
        >
          뚜러뻥
        </div>

        <div
          id="confirmText"
          style="font-size:12px;line-height:1.6"
        ></div>

        <button
          id="confirmYes"
          class="modalButton"
        >
          사용한다
        </button>

        <button
          id="confirmNo"
          class="modalButton"
        >
          안 한다
        </button>

      </div>

    </div>

  </div>


  <!-- 뽑기 -->
  <div id="gachaScreen" class="screen">

    <canvas id="gachaCanvas"></canvas>

    <button id="gachaBack">
      뒤로
    </button>

    <div id="gachaTitle">
      변기 뽑기
    </div>

    <div
      id="gachaCoins"
      class="pixelBox"
    >
      COIN <span id="gachaCoinText">0</span>
    </div>

    <button id="gachaPull">
      30 COIN 뽑기
    </button>

    <button id="openCapsule">
      캡슐 열기
    </button>

    <div id="gachaResult">

      <canvas
        id="resultCanvas"
        width="130"
        height="105"
      ></canvas>

      <div id="resultName"></div>

      <div id="resultAbility"></div>

      <button
        id="resultClose"
        class="modalButton"
      >
        확인
      </button>

    </div>

  </div>


  <!-- 컬렉션 -->
  <div
    id="collectionScreen"
    class="screen pageScreen"
  >

    <div class="pageHeader">
      <h2>보유 변기</h2>

      <button
        id="collectionBack"
        class="backButton"
      >
        뒤로
      </button>
    </div>

    <div id="collectionList"></div>

  </div>


  <!-- 가구 -->
  <div
    id="furnitureScreen"
    class="screen pageScreen"
  >

    <div class="pageHeader">
      <h2>가구 상점</h2>

      <button
        id="furnitureBack"
        class="backButton"
      >
        뒤로
      </button>
    </div>

    <div id="furnitureContent"></div>

  </div>

</div>


<script>

/* =====================================================
   화면
===================================================== */

const screens = {
  start: document.getElementById("startScreen"),
  main: document.getElementById("mainScreen"),
  gacha: document.getElementById("gachaScreen"),
  collection: document.getElementById("collectionScreen"),
  furniture: document.getElementById("furnitureScreen")
};


function showScreen(name) {

  Object.values(screens).forEach(
    screen =>
      screen.classList.remove("active")
  );

  screens[name].classList.add("active");

  if (name === "main") {
    resizeMainCanvas();
  }

  if (name === "gacha") {
    resizeGachaCanvas();
  }
}

/* =====================================================
   캐릭터 효과
===================================================== */

function calculateIncome() {

  let gain =
    moneyPower;

  let positive =
    0;

  let negative =
    0;

  let multiplier =
    1;


  characters.forEach(
    (character,index) => {

      /*
        주인공 양변기는 기본 캐릭터라
        효과 중복 계산 안 함.
      */

      let amount =
        owned[index];

      if (index === 0) {
        amount =
          Math.max(
            0,
            amount - 1
          );
      }


      positive +=
        (
          character.buffIncome ||
          0
        ) *
        amount;


      negative +=
        (
          character.debuffIncome ||
          0
        ) *
        amount;


      if (
        character.multiplier &&
        amount > 0
      ) {

        for (
          let i = 0;
          i < amount;
          i++
        ) {

          multiplier *=
            character.multiplier;
        }
      }

    }
  );


  gain += positive;

  gain -= negative;

  gain =
    Math.max(
      1,
      gain
    );

  gain =
    Math.floor(
      gain *
      multiplier
    );

  return Math.max(
    1,
    gain
  );
}


function calculateCooldown() {

  let cooldown =
    earnCooldown;


  characters.forEach(
    (character,index) => {

      let amount =
        owned[index];

      if (index === 0) {
        amount =
          Math.max(
            0,
            amount - 1
          );
      }


      cooldown -=
        (
          character.cooldownBuff ||
          0
        ) *
        amount;


      cooldown +=
        (
          character.debuffCooldown ||
          0
        ) *
        amount;

    }
  );


  return Math.max(
    .1,
    cooldown
  );
}

/* =====================================================
   주인공
===================================================== */

const player = {

  x:180,
  y:350,

  targetX:180,
  targetY:350,

  direction:1,

  speed:3,

  moving:false

};


function updatePlayer() {

  if (!player.moving) {
    return;
  }

  const dx =
    player.targetX -
    player.x;

  const dy =
    player.targetY -
    player.y;

  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if (distance < 3) {

    player.x =
      player.targetX;

    player.y =
      player.targetY;

    player.moving =
      false;

    return;
  }


  player.x +=
    dx /
    distance *
    player.speed;

  player.y +=
    dy /
    distance *
    player.speed;

}


/* =====================================================
   포인터 위치
===================================================== */

function pointerPosition(
  canvas,
  event
) {

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      canvas.width /
      rect.width,

    y:
      (
        event.clientY -
        rect.top
      ) *
      canvas.height /
      rect.height

  };

}

      i--
    ) {

      const c =
        roamingCharacters[i];


      if (
        pos.x >= c.x - 5 &&
        pos.x <= c.x + 70 &&
        pos.y >= c.y - 5 &&
        pos.y <= c.y + 75
      ) {

        openPlungerConfirm(i);

        return;
      }

    }


    /*
      빈 곳은 더블터치 이동
    */

    const now =
      Date.now();


    if (
      now - lastTap <
      320
    ) {

      player.targetX =
        Math.max(
          5,
          Math.min(
            mainCanvas.width - 70,
            pos.x - 30
          )
        );

      player.targetY =
        Math.max(
          115,
          Math.min(
            mainCanvas.height - 175,
            pos.y - 35
          )
        );


      player.direction =
        player.targetX <
        player.x
        ? -1
        : 1;


      player.moving =
        true;
    }


    lastTap =
      now;

  }
);


/* =====================================================
   뚜러뻥
===================================================== */

document
.getElementById("plungerShopButton")
.addEventListener(
  "click",
  () => {

    if (
      coins < 50
    ) {

      toast(
        "뚜러뻥은 50코인입니다."
      );

      return;
    }


    coins -= 50;

    plungers++;

    updateUI();

    toast(
      "뚜러뻥을 샀습니다."
    );

  }
);


const confirmOverlay =
  document.getElementById("confirmOverlay");

const confirmText =
  document.getElementById("confirmText");


function openPlungerConfirm(
  roamingIndex
) {

  const roaming =
    roamingCharacters[
      roamingIndex
    ];

  const character =
    characters[
      roaming.characterIndex
    ];


  selectedRemoveIndex =
    roamingIndex;


  confirmText.innerHTML =
    "<b>" +
    character.name +
    "</b>에게<br>" +
    "뚜러뻥을 사용하겠습니까?<br><br>" +
    "보유 뚜러뻥: " +
    plungers +
    "개";


  confirmOverlay.style.display =
    "block";
}


document
.getElementById("confirmNo")
.addEventListener(
  "click",
  () => {

    confirmOverlay.style.display =
      "none";

    selectedRemoveIndex =
      null;

  }
);


document
.getElementById("confirmYes")
.addEventListener(
  "click",
  () => {

    if (
      selectedRemoveIndex ===
      null
    ) {

      return;
    }


    if (
      plungers <= 0
    ) {

      confirmOverlay.style.display =
        "none";

      selectedRemoveIndex =
        null;

      toast(
        "뚜러뻥이 없습니다."
      );

      return;
    }


    const roaming =
      roamingCharacters[
        selectedRemoveIndex
      ];


    const characterIndex =
      roaming.characterIndex;


    const character =
      characters[
        characterIndex
      ];


    /*
      주인공은 roamingCharacters 안에
      넣지 않으므로 애초에 제거 불가능
    */


    plungers--;


    owned[
      characterIndex
    ] =
      Math.max(
        0,
        owned[
          characterIndex
        ] - 1
      );


    roamingCharacters.splice(
      selectedRemoveIndex,
      1
    );


    confirmOverlay.style.display =
      "none";


    toast(
      character.name +
      "에게 뚜러뻥을 사용했습니다."
    );


    selectedRemoveIndex =
      null;

    updateUI();

  }
);

function drawBackground() {

  ctx.fillStyle =
    "#ededed";

  ctx.fillRect(
    0,
    0,
    mainCanvas.width,
    115
  );


  ctx.fillStyle =
    "#999";

  ctx.fillRect(
    0,
    112,
    mainCanvas.width,
    4
  );


  ctx.fillStyle =
    "#d5d5d5";

  ctx.fillRect(
    0,
    116,
    mainCanvas.width,
    mainCanvas.height-116
  );


  const tile = 43;


  ctx.strokeStyle =
    "#bdbdbd";


  for (
    let x=0;
    x<mainCanvas.width;
    x+=tile
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x,
      116
    );

    ctx.lineTo(
      x,
      mainCanvas.height
    );

    ctx.stroke();

  }


  for (
    let y=116;
    y<mainCanvas.height;
    y+=tile
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      mainCanvas.width,
      y
    );

    ctx.stroke();

  }

}

      "#e6bb23";

    ctx.fillRect(
      x-15,
      y-5,
      30,
      19
    );

    ctx.fillRect(
      x-8,
      y-40,
      16,
      32
    );

  }

}


/* =====================================================
   돌아다니는 변기
===================================================== */

function addRoamingCharacter(
  characterIndex
) {

  const angle =
    Math.random() *
    Math.PI *
    2;


  roamingCharacters.push({

    characterIndex,

    x:
      15 +
      Math.random() *
      Math.max(
        30,
        mainCanvas.width-90
      ),

    y:
      135 +
      Math.random() *
      Math.max(
        80,
        mainCanvas.height-340
      ),

    vx:
      Math.cos(angle) *
      (
        .25 +
        Math.random() *
        .4
      ),

    vy:
      Math.sin(angle) *
      (
        .25 +
        Math.random() *
        .4
      ),

    phase:
      Math.random() *
      10

  });

}


function updateRoaming() {

  roamingCharacters.forEach(
    c => {

      c.x += c.vx;

      c.y += c.vy;


      if (
        c.x < 2 ||
        c.x >
        mainCanvas.width-70
      ) {

        c.vx *= -1;
      }


      if (
        c.y < 120 ||
        c.y >
        mainCanvas.height-180
      ) {

        c.vy *= -1;
      }


      c.phase += .05;

    }
  );

}


/* =====================================================
   메인 그리기
===================================================== */

function drawMain() {

  ctx.clearRect(
    0,
    0,
    mainCanvas.width,
    mainCanvas.height
  );


  drawBackground();


  placedFurniture.forEach(
    drawFurniture
  );


  roamingCharacters.forEach(
    c => {

      drawCharacter(
        ctx,
        characters[
          c.characterIndex
        ],
        c.x,
        c.y +
        Math.sin(
          c.phase
        ) *
        1.5
      );

    }
  );


  const bounce =
    player.moving
    ? Math.sin(
        performance.now() /
        90
      ) * 2
    : 0;


  ctx.save();


  if (
    player.direction < 0
  ) {

    ctx.translate(
      player.x+65,
      0
    );

    ctx.scale(
      -1,
      1
    );

    drawCharacter(
      ctx,
      characters[0],
      0,
      player.y+bounce
    );

  } else {

    drawCharacter(
      ctx,
      characters[0],
      player.x,
      player.y+bounce
    );

  }


  ctx.restore();


  ctx.fillStyle =
    "#111";

  ctx.font =
    "11px monospace";

  ctx.textAlign =
    "center";

  ctx.fillText(
    playerName,
    player.x+31,
    player.y-7
  );

}


/* =====================================================
   뽑기
===================================================== */

const gachaCanvas =
  document.getElementById("gachaCanvas");

const gctx =
  gachaCanvas.getContext("2d");

gctx.imageSmoothingEnabled =
  false;


function resizeGachaCanvas() {

  gachaCanvas.width =
    gachaCanvas.clientWidth;

  gachaCanvas.height =
    gachaCanvas.clientHeight;
}


let gachaState =
  "idle";

let capsuleY =
  245;

let currentGacha =
  null;


function weightedRandomCharacter() {

  const total =
    characters.reduce(
      (
        sum,
        character
      ) =>
        sum +
        character.weight,
      0
    );


  let value =
    Math.random() *
    total;


  for (
    let i=0;
    i<characters.length;
    i++
  ) {

    value -=
      characters[i].weight;


    if (
      value <= 0
    ) {

      return i;
    }

  }


  return 0;
}


function drawCapsule(
  context,
  x,
  y,
  r
) {

  context.fillStyle =
    "#111";

  context.beginPath();

  context.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  context.fill();


  context.fillStyle =
    "#df4e4e";

  context.beginPath();

  context.arc(
    x,
    y,
    r-3,
    Math.PI,
    0
  );

  context.fill();


  context.fillStyle =
    "#eee";

  context.beginPath();

  context.arc(
    x,
    y,
    r-3,
    0,
    Math.PI
  );

  context.fill();


  context.fillStyle =
    "#111";

  context.fillRect(
    x-r+2,
    y-2,
    r*2-4,
    4
  );

}


function drawGacha() {

  const w =
    gachaCanvas.width;

  const h =
    gachaCanvas.height;

  const cx =
    w/2;


  gctx.fillStyle =
    "#d7d7d7";

  gctx.fillRect(
    0,
    0,
    w,
    h
  );


  /* 기계 몸통 */

  gctx.fillStyle =
    "#111";

  gctx.fillRect(
    cx-118,
    220,
    236,
    380
  );


  gctx.fillStyle =
    "#d24b48";

  gctx.fillRect(
    cx-114,
    224,
    228,
    372
  );


  /* 유리 돔 */

  gctx.fillStyle =
    "#111";

  gctx.beginPath();

  gctx.arc(
    cx,
    220,
    118,
    Math.PI,
    0
  );

  gctx.fill();


  gctx.fillStyle =
    "#ccebf4";

  gctx.beginPath();

  gctx.arc(
    cx,
    220,
    112,
    Math.PI,
    0
  );

  gctx.fill();


  const balls = [
    [-73,-20],
    [-40,-61],
    [0,-72],
    [40,-57],
    [73,-19],
    [-52,20],
    [-13,14],
    [28,15],
    [60,23]
  ];


  const colors = [
    "#dc4a48",
    "#367bd2",
    "#e4c63b",
    "#53ae59",
    "#a96cd1"
  ];


  balls.forEach(
    (ball,index) => {

      gctx.fillStyle =
        "#111";

      gctx.beginPath();

      gctx.arc(
        cx+ball[0],
        210+ball[1],
        20,
        0,
        Math.PI*2
      );

      gctx.fill();


      gctx.fillStyle =
        colors[
          index %
          colors.length
        ];

      gctx.beginPath();

      gctx.arc(
        cx+ball[0],
        210+ball[1],
        17,
        0,
        Math.PI*2
      );

      gctx.fill();

    }
  );


  /* 손잡이 */

  gctx.fillStyle =
    "#111";

  gctx.fillRect(
    cx-42,
    365,
    84,
    84
  );


  gctx.fillStyle =
    "#edca38";

  gctx.fillRect(
    cx-38,
    369,
    76,
    76
  );


  gctx.fillStyle =
    "#111";

  gctx.fillRect(
    cx-7,
    383,
    14,
    49
  );

  gctx.fillRect(
    cx-25,
    401,
    50,
    14
  );


  /* 출구 */

  gctx.fillStyle =
    "#111";

  gctx.fillRect(
    cx-57,
    478,
    114,
    78
  );


  gctx.fillStyle =
    "#343434";

  gctx.fillRect(
    cx-50,
    485,
    100,
    64
  );


  if (
    gachaState ===
    "falling"
  ) {

    drawCapsule(
      gctx,
      cx,
      capsuleY,
      27
    );

  }


  if (
    gachaState ===
    "ready"
  ) {

    drawCapsule(
      gctx,
      cx,
      515,
      27
    );

  }

}


/* =====================================================
   뽑기 UI
===================================================== */

const gachaPull =
  document.getElementById("gachaPull");

const openCapsule =
  document.getElementById("openCapsule");

const gachaResult =
  document.getElementById("gachaResult");

const resultCanvas =
  document.getElementById("resultCanvas");

const rctx =
  resultCanvas.getContext("2d");

const resultName =
  document.getElementById("resultName");

const resultAbility =
  document.getElementById("resultAbility");


document
.getElementById("gachaButton")
.addEventListener(
  "click",
  () => {

    showScreen("gacha");

    updateUI();

  }
);


document
.getElementById("gachaBack")
.addEventListener(
  "click",
  () => {

    if (
      gachaState ===
      "falling"
    ) {
      return;
    }

    showScreen("main");

  }
);


gachaPull.addEventListener(
  "click",
  () => {

    if (
      gachaState !==
      "idle"
    ) {
      return;
    }


    if (
      coins <
      gachaCost
    ) {

      toast(
        "변기 뽑기는 30코인입니다."
      );

      return;
    }


    coins -=
      gachaCost;


    currentGacha =
      weightedRandomCharacter();


    capsuleY =
      245;


    gachaState =
      "falling";


    gachaPull.style.display =
      "none";


    updateUI();


    setTimeout(
      () => {

        gachaState =
          "ready";

        openCapsule.style.display =
          "block";

      },
      1200
    );

  }
);


openCapsule.addEventListener(
  "click",
  () => {

    const character =
      characters[
        currentGacha
      ];


    owned[
      currentGacha
    ]++;


    addRoamingCharacter(
      currentGacha
    );


    rctx.clearRect(
      0,
      0,
      resultCanvas.width,
      resultCanvas.height
    );


    /*
      레어 황금 시리즈는
      캐릭터 주변 빛나는 효과
    */

    if (
      character.gold ||
      character.rarity ===
      "레어"
    ) {

      gachaResult.classList.add(
        "rareGlow"
      );


      for (
        let i=0;
        i<10;
        i++
      ) {

        const angle =
          (
            Math.PI*2 /
            10
          ) * i;

        const px =
          65 +
          Math.cos(angle) *
          46;

        const py =
          53 +
          Math.sin(angle) *
          38;


        rctx.fillStyle =
          i%2===0
          ? "#f1c52c"
          : "#fff1a0";


        rctx.fillRect(
          px-3,
          py-3,
          6,
          6
        );

      }

    } else {

      gachaResult.classList.remove(
        "rareGlow"
      );

    }


    drawCharacter(
      rctx,
      character,
      33,
      15
    );


    resultName.textContent =
      character.name +
      " / " +
      character.rarity;


    resultAbility.innerHTML =
      "<b>" +
      character.ability +
      "</b><br>" +
      character.description;


    if (
      character.negative
    ) {

      resultAbility.innerHTML +=
        "<br><br><b>디버프 캐릭터</b>";

    }


    gachaResult.style.display =
      "block";


    openCapsule.style.display =
      "none";


    gachaState =
      "result";


    updateUI();

  }
);


document
.getElementById("resultClose")
.addEventListener(
  "click",
  () => {

    gachaResult.style.display =
      "none";


    gachaResult.classList.remove(
      "rareGlow"
    );


    gachaPull.style.display =
      "block";


    gachaState =
      "idle";


    currentGacha =
      null;

  }
);


/* =====================================================
   컬렉션
===================================================== */

document
.getElementById("collectionButton")
.addEventListener(
  "click",
  () => {

    buildCollection();

    showScreen(
      "collection"
    );

  }
);


document
.getElementById("collectionBack")
.addEventListener(
  "click",
  () => {

    showScreen("main");

  }
);


function buildCollection() {

  const list =
    document.getElementById(
      "collectionList"
    );


  list.innerHTML =
    "";


  characters.forEach(
    (
      character,
      index
    ) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card";


      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        92;

      canvas.height =
        90;


      const cctx =
        canvas.getContext(
          "2d"
        );


      if (
        owned[index] > 0
      ) {

        drawCharacter(
          cctx,
          character,
          14,
          8
        );

      } else {

        cctx.fillStyle =
          "#222";

        cctx.font =
          "40px monospace";

        cctx.fillText(
          "?",
          33,
          57
        );

      }


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "cardInfo";


      if (
        owned[index] > 0
      ) {

        info.innerHTML =
          "<b>" +
          character.name +
          "</b><br>" +
          "등급: " +
          character.rarity +
          "<br>" +
          "보유: " +
          owned[index] +
          "개<br>" +
          "<b>" +
          character.ability +
          "</b><br>" +
          character.description;


        if (
          index === 0
        ) {

          info.innerHTML +=
            "<br>첫 번째 양변기는 주인공";

        }


        if (
          character.negative
        ) {

          info.innerHTML +=
            "<br><b>디버프 적용 중</b>";

        }

      } else {

        info.innerHTML =
          "<b>미발견 캐릭터</b><br>" +
          "???<br>보유 0개";

      }


      card.appendChild(
        canvas
      );

      card.appendChild(
        info
      );

      list.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   가구 상점
===================================================== */

document
.getElementById("furnitureButton")
.addEventListener(
  "click",
  () => {

    buildFurnitureShop();

    showScreen(
      "furniture"
    );

  }
);


document
.getElementById("furnitureBack")
.addEventListener(
  "click",
  () => {

    showScreen(
      "main"
    );

  }
);


function buildFurnitureShop() {

  const content =
    document.getElementById(
      "furnitureContent"
    );


  content.innerHTML =
    "";


  furnitureCatalog.forEach(
    (
      item,
      index
    ) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "furnitureCard";


      const purchased =
        purchasedFurniture[
          index
        ];


      card.innerHTML =
        '<div class="furnitureTitle">' +
        item.name +
        '</div>' +
        '<div class="furnitureDescription">' +
        item.description +
        '<br>가격: ' +
        item.price +
        ' 코인</div>';


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "buyFurniture";


      button.textContent =
        purchased
        ? "구매 완료"
        : item.price +
          " COIN 구매";


      button.disabled =
        purchased;


      button.addEventListener(
        "click",
        () => {

          if (
            purchasedFurniture[
              index
            ]
          ) {

            return;
          }


          if (
            coins <
            item.price
          ) {

            alert(
              "코인이 부족합니다."
            );

            return;
          }


          coins -=
            item.price;


          purchasedFurniture[
            index
          ] =
            true;


          /*
            구매하면 자동으로
            화장실에 설치
          */

          placedFurniture.push({

            type:
              item.type,

            x:
              45 +
              Math.random() *
              Math.max(
                40,
                mainCanvas.width -
                100
              ),

            y:
              170 +
              Math.random() *
              Math.max(
                60,
                mainCanvas.height -
                400
              )

          });


          startFurnitureEffect(
            item
          );


          updateUI();

          buildFurnitureShop();

        }
      );


      card.appendChild(
        button
      );


      content.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   가구 효과

   비싼 가구일수록 큰돈
   대신 작동 쿨타임 증가
===================================================== */

function startFurnitureEffect(
  item
) {

  setInterval(
    () => {

      let gain;


      if (
        item.doubleIncome
      ) {

        gain =
          calculateIncome() *
          2;

      } else {

        gain =
          item.income;
      }


      coins += gain;

      updateUI();

    },
    item.interval
  );

}


/* =====================================================
   게임 루프
===================================================== */

function loop() {

  if (
    screens.main.classList.contains(
      "active"
    )
  ) {

    updatePlayer();

    updateRoaming();

    drawMain();

  }


  if (
    screens.gacha.classList.contains(
      "active"
    )
  ) {

    if (
      gachaState ===
      "falling"
    ) {

      capsuleY += 4.3;

      if (
        capsuleY > 515
      ) {

        capsuleY =
          515;
      }

    }


    drawGacha();

  }


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   리사이즈
===================================================== */

window.addEventListener(
  "resize",
  () => {

    resizeMainCanvas();

    resizeGachaCanvas();

  }
);


/* =====================================================
   시작
===================================================== */

resizeMainCanvas();

resizeGachaCanvas();

updateUI();

loop();

</script>
